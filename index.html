<style>
  :root{
    --bg:#0E2723; --surface:#153934; --raised:#1B453F; --line:#2A5049;
    --accent:#F2A65A; --accent2:#90D161; --accent3:#7FC8B0;
    --text:#EFF6F2; --muted:#8FB2A8; --danger:#E07A5F;
    /* Status/severity scale (score-based: good/warn/bad) — kept deliberately
       separate from the 3 accents above, which are reserved for fixed
       categories (food/water/exercise). --danger already covers the "bad"
       tier; these two fill in "good" and "warn" so a score or vital-sign
       indicator never borrows a category color by coincidence. */
    --status-good:#5FB878; --status-warn:#D6A23C;
    /* Macro palette (protein/carbs/fat) — a separate cool triplet so it never
       collides with the food/water/exercise category colors it can sit right
       next to on Hoy (that collision — orange meaning "food" in one card and
       "protein" one card below — was the clearest case found in the audit). */
    --macro-protein:#B9A0E0; --macro-carbs:#D999C7; --macro-fat:#8FA8DE;
    /* Text/mark color for anything sitting on an accent-colored fill (button
       labels, a toggle's "on" knob) — aliases --bg on dark, since a dark mark
       on a bright accent is what already looks right there. Light mode can't
       reuse --bg for this (it's near-white, same problem accent2 had) so it
       points at --text instead. Kept as its own token so both callers update
       together instead of drifting. */
    --on-accent:#0E2723;
    /* Dial/ring tracks (Hoy's calorie/water/exercise rings, the weekly-goals
       mini-dials, the Vitality score ring) need a decorative stroke thick and
       visible enough to read as "the unfilled part of a ring" — --line works
       for that on dark, but light theme's --line is a near-invisible hairline
       border color (fine for 1px borders, not for a 10px ring) so it needs
       its own value there instead of reusing --line. */
    --ring-track:#2A5049;
  }
  /* Light mode: same 15 category/status/macro/neutral tokens, independently
     darkened and contrast-checked against a white ground (not copy-pasted
     from the dark set — the accent2 audit showed dark-tuned colors quietly
     fail on light). Follows the OS by default; :root[data-theme] lets the
     in-app Settings toggle override it either direction. */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F4F7F5; --surface:#FFFFFF; --raised:#EAF0EE; --line:#DCE6E2;
      --accent:#C9731D; --accent2:#4E8B23; --accent3:#358D6F;
      --text:#132A25; --muted:#5B7A72; --danger:#D04825;
      --status-good:#358D4E; --status-warn:#AD7E1F;
      --macro-protein:#6C3DB8; --macro-carbs:#B03B8F; --macro-fat:#325AAE;
      --on-accent:#132A25;
      --ring-track:#C4D2CC;
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F7F5; --surface:#FFFFFF; --raised:#EAF0EE; --line:#DCE6E2;
    --accent:#C9731D; --accent2:#4E8B23; --accent3:#358D6F;
    --text:#132A25; --muted:#5B7A72; --danger:#D04825;
    --status-good:#358D4E; --status-warn:#AD7E1F;
    --macro-protein:#6C3DB8; --macro-carbs:#B03B8F; --macro-fat:#325AAE;
    --on-accent:#132A25;
    --ring-track:#C4D2CC;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .display{font-family:'Space Grotesk',sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  a{color:inherit;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;background:var(--raised);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 10px;font-size:14px;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;}
  .label{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .info-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;width:18px;height:18px;min-width:18px;font-size:11px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:normal;}
  .info-btn:hover{border-color:var(--accent);color:var(--accent);}
  /* min-height (not a padding bump) so this only raises buttons that were
     genuinely short (Estimar/Guardar/etc. measured at 34-38px in the audit) —
     anything already taller from its own content (icon+label buttons) is
     completely unaffected. */
  .btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px;}
  .btn-primary{background:var(--accent);color:var(--on-accent);}
  .btn-ghost{background:var(--raised);color:var(--text);border:1px solid var(--line);}
  .btn-danger{background:var(--danger);color:var(--bg);}
  .btn:disabled{opacity:.5;cursor:default;}
  .row-item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:var(--raised);border-radius:12px;}
  .suggest-list{position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--raised);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:180px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .suggest-item{padding:8px 10px;font-size:14px;cursor:pointer;}
  .suggest-item:hover{background:var(--surface);}
  .pill{border-radius:12px;border:1px solid var(--line);background:var(--raised);padding:9px 4px;text-align:center;cursor:pointer;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;}
  .pill.active{border-color:var(--accent);background:rgba(242,166,90,.12);color:var(--accent);font-weight:700;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .grid-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;}
  .grid2>*,.grid4>*,.grid-icons>*{min-width:0;}
  .expand-card{cursor:pointer;position:relative;}
  .expand-card.expanded{grid-column:1/-1;}
  .expand-card::after{
    content:''; position:absolute; right:14px; bottom:14px; width:0; height:0;
    border-left:7px solid transparent; border-right:7px solid transparent;
    border-top:9px solid var(--muted); pointer-events:none; transition:transform .15s;
  }
  .expand-card.expanded::after{ transform:rotate(180deg); }
  .stack{display:flex;flex-direction:column;gap:16px;}
  /* Opt-in, not a change to .stack itself — most tabs are sequential forms/lists
     that need to stay single-column at any width. Hoy is the one screen where a
     desktop viewport left ~8 cards in one wide column with the rest of the
     screen empty; this reflows it to 2 columns above the mobile-nav breakpoint,
     with .full-span escape-hatching the pieces that shouldn't be halved
     (a 4-up stat grid, a full-width button). */
  @media (min-width: 900px){
    .stack.grid-desktop{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:16px;}
    .stack.grid-desktop > .full-span{grid-column:1/-1;}
  }

  #app{display:flex;min-height:100vh;max-width:1180px;margin:0 auto;}
  nav.side{width:210px;flex-shrink:0;padding:24px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;}
  nav.side .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;padding:0 12px 22px;}
  nav.side .brand .owner{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px;}
  nav.side .brand-logo{width:36px;height:36px;flex-shrink:0;}
  nav.side .navbtn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:var(--muted);cursor:pointer;font-size:14px;margin-bottom:2px;}
  nav.side .navbtn.active{background:var(--raised);color:var(--accent);font-weight:700;}
  nav.side .navbtn .ic{font-size:16px;width:20px;text-align:center;}
  .ic-svg{width:19px;height:19px;flex-shrink:0;display:block;}
  .ic-svg path,.ic-svg circle,.ic-svg rect{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
  .ic-svg .fill{fill:currentColor;stroke:none;}
  nav.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;}
  main{flex:1;padding:28px 32px 60px;min-width:0;}
  main header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  main header h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0;}
  main header .sub{color:var(--muted);font-size:13px;text-transform:capitalize;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:calc(100vw - 32px);max-width:420px;margin:0;padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(224,122,95,.15);border:1px solid var(--danger);border-radius:10px;color:var(--danger);font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .toast.ok{background:rgba(127,200,176,.15);border-color:var(--accent3);color:var(--accent3);}

  .dial-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0;}
  .legend{display:flex;gap:16px;}
  .ring-fill-animate{transition:stroke-dashoffset 1000ms cubic-bezier(.16,1,.3,1);}
  @media (prefers-reduced-motion:reduce){ .ring-fill-animate{transition:none;} }
  .legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:99px;display:inline-block;}

  /* Same min-height reasoning as .btn — icon+label uses (meal/exercise type)
     are already well above this from their own content; only the label-only
     uses (gender pills, measured at 34px) were actually short. */
  .meal-type-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-size:10px;color:var(--muted);min-height:44px;}
  .meal-type-btn.active{border-color:var(--accent);background:rgba(242,166,90,.12);color:var(--accent);font-weight:700;}

  .wheel-wrap{position:relative;}
  .wheel-row{display:flex;gap:8px;}
  .wheel-col{flex:1;min-width:0;height:180px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:72px 0;}
  .wheel-col::-webkit-scrollbar{display:none;}
  .wheel-item{height:36px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:14px;color:var(--muted);cursor:pointer;transition:color .15s,font-size .15s;}
  .wheel-item.selected{color:var(--accent);font-weight:700;font-size:16px;}
  .wheel-highlight{position:absolute;left:0;right:0;top:72px;height:36px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(242,166,90,.08);pointer-events:none;border-radius:6px;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-day{aspect-ratio:1;min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raised);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--text);position:relative;}
  .cal-day.empty{visibility:hidden;}
  .cal-day.has-data::after{content:'';width:5px;height:5px;border-radius:99px;background:var(--accent);position:absolute;bottom:6px;}
  .cal-day.has-data.flagged::after{background:var(--danger);width:6px;height:6px;}
  .cal-day.selected{border-color:var(--accent);background:rgba(242,166,90,.15);}
  .cal-day.today{color:var(--accent2);font-weight:700;}
  .cal-dow{text-align:center;font-size:10px;color:var(--muted);}

  .chart-box{width:100%;overflow-x:auto;}
  .med-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--raised);border-radius:12px;}
  .med-due{border:1px solid var(--accent);background:rgba(242,166,90,.1);}
  .switch{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--accent);}
  .switch .knob{width:16px;height:16px;border-radius:99px;background:var(--text);position:absolute;top:3px;left:3px;transition:left .15s;}
  .switch.on .knob{left:19px;background:var(--on-accent);}

  .scanner-video-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;}
  .scanner-video-wrap video{width:100%;height:100%;object-fit:cover;}
  .scanner-frame{position:absolute;inset:18% 12%;border:3px solid var(--accent);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none;}

  @media (max-width: 820px){
    #app{flex-direction:column;}
    nav.side{width:100%;height:auto;position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:12px;border-right:none;border-bottom:1px solid var(--line);z-index:20;background:var(--bg);}
    /* The OS/WebView scrollbar this row relies on for a "more to scroll" signal
       doesn't reliably render on touch — a custom-styled scrollbar in particular
       is usually suppressed outside an active drag. This chevron is a signal
       that doesn't depend on the scrollbar rendering at all. */
    nav.side::after{
      content:'›'; position:absolute; top:0; right:0; bottom:0; width:32px;
      background:linear-gradient(to right, transparent, var(--bg) 65%);
      display:flex; align-items:center; justify-content:flex-end; padding-right:4px;
      color:var(--muted); font-size:18px; font-weight:700; pointer-events:none;
    }
    nav.side .brand{display:none;}
    nav.side .navbtn{flex-direction:column;font-size:10px;gap:4px;white-space:nowrap;}
    /* Settings/Export/Import are actions, not tabs — riding along in the same
       scroll strip with only a hairline border made them read as 3 more
       destinations rather than a distinct utility group. */
    nav.side .foot{
      margin-top:0; margin-left:auto; flex-direction:row; padding-left:10px; gap:6px;
      border-left:2px solid var(--line); background:var(--surface); border-radius:12px;
    }
    main{padding:18px 16px 60px;}
    .grid2{grid-template-columns:1fr;}
    .grid4{grid-template-columns:1fr 1fr;}
  }
</style>

<script>
/* ================= utils ================= */
const LS = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch{ return null; } },
  set(k,v){
    try{
      localStorage.setItem(k, JSON.stringify(v));
      // vl:apikey is device-local by design (never synced) — it must not bump the
      // change timestamp either, or a device with no real data but a freshly-typed
      // key can look "newer" than the cloud and overwrite it with near-empty state.
      if(k!=='vl:_lastChangeAt' && k!=='vl:apikey'){
        localStorage.setItem('vl:_lastChangeAt', String(Date.now()));
        if(typeof window._scheduleCloudPush==='function') window._scheduleCloudPush();
      }
      return true;
    }catch(e){ console.error('storage error', e); return false; }
  }
};
window._syncState = { ready:false, user:null, syncing:false, lastSyncAt:null, error:null };
function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isoDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isoOf(y,m,day){ return `${y}-${pad(m+1)}-${pad(day)}`; }
/* ================= i18n ================= */

function getLang(){ return LS.get('vl:lang') || 'es'; }
function setLang(l){ LS.set('vl:lang', l); state.lang = l; render(); }
function getTheme(){ return LS.get('vl:theme') || 'system'; }
function setTheme(t){ LS.set('vl:theme', t); state.theme = t; applyTheme(); render(); }
function applyTheme(){
  if(state.theme==='light' || state.theme==='dark') document.documentElement.dataset.theme = state.theme;
  else delete document.documentElement.dataset.theme;
  const isLight = state.theme==='light' || (state.theme==='system' && window.matchMedia('(prefers-color-scheme: light)').matches);
  syncNativeStatusBar(isLight);
}
async function syncNativeStatusBar(isLight){
  if(!(window.Capacitor && window.Capacitor.isNativePlatform())) return;
  // Capacitor 8's core bundles SystemBars (superseding the old standalone
  // @capacitor/status-bar plugin) — one call themes both the status bar and
  // the Android navigation/gesture bar, matching how they render on
  // edge-to-edge Android (API 35+) targets like this app's (targetSdk 36).
  const SystemBars = window.Capacitor.Plugins.SystemBars;
  if(!SystemBars) return;
  try{ await SystemBars.setStyle({ style: isLight ? 'LIGHT' : 'DARK' }); }catch(e){}
}
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{ if(state.theme==='system') applyTheme(); });
}
function tr(key){ return (I18N[state.lang] && I18N[state.lang][key]) ?? I18N.es[key] ?? key; }
function trf(key, params){ return tr(key).replace(/\{(\w+)\}/g, (_,k)=>params[k]??''); }

const DOW_ES = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DOW_EN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function dowLabels(){ return state.lang==='en' ? DOW_EN : DOW_ES; }
function dayLetter(iso){ const [y,m,dd]=iso.split('-').map(Number); const idx=(new Date(y,m-1,dd).getDay()+6)%7; return dowLabels()[idx][0]; }
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabels(){ return state.lang==='en' ? MONTHS_EN : MONTHS_ES; }
function formatDateEs(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(state.lang==='en' ? 'en-US' : 'es-ES', { weekday:'long', day:'numeric', month:'long' });
}
function nowHM(){ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const BODYCOMP_FIELDS = [
  { key:'bmi', label:'IMC', unit:'', info:'El IMC es tu peso dividido entre tu estatura al cuadrado (kg/m²). Es un indicador rápido de si tu peso está en un rango saludable para tu altura, pero no distingue entre grasa y músculo — una persona muy musculosa puede tener un IMC alto sin exceso de grasa real.<br><br>Se relaciona directamente con tu <b>Grasa corporal %</b>: cuando el IMC está alto por exceso de grasa (no de músculo), ambos suben juntos.<br><br><b>Rangos de referencia:</b><br>Bajo peso: menos de 18.5<br>Normal: 18.5 – 24.9<br>Sobrepeso: 25 – 29.9<br>Obesidad: 30 o más',
    infoEn:`BMI is your weight divided by your height squared (kg/m²). It's a quick indicator of whether your weight is in a healthy range for your height, but it doesn't distinguish fat from muscle — a very muscular person can have a high BMI without excess fat.<br><br>It's directly related to your <b>Body fat %</b>: when BMI is high due to excess fat (not muscle), both rise together.<br><br><b>Reference ranges:</b><br>Underweight: below 18.5<br>Normal: 18.5 – 24.9<br>Overweight: 25 – 29.9<br>Obesity: 30 or above` },
  { key:'bodyFatPct', label:'Grasa corporal', unit:'%', info:'Es el porcentaje de tu peso total que corresponde a grasa corporal (visceral + subcutánea). Es más preciso que el IMC porque sí distingue grasa de músculo.<br><br>Se relaciona con <b>Grasa visceral</b> y <b>Grasa subcutánea</b> (la suma aproximada de ambas), y de forma inversa con tu <b>Agua corporal %</b> y <b>Músculo esquelético %</b> — el tejido graso retiene mucha menos agua que el muscular, así que a mayor grasa, menor % de agua y músculo.<br><br><b>Rangos de referencia aproximados</b> (varían por edad y sexo):<br>Hombres: 10–20% saludable<br>Mujeres: 18–28% saludable',
    infoEn:`This is the percentage of your total weight that's body fat (visceral + subcutaneous). It's more precise than BMI because it does distinguish fat from muscle.<br><br>It's related to your <b>Visceral fat</b> and <b>Subcutaneous fat</b> (roughly the sum of both), and inversely to your <b>Body water %</b> and <b>Skeletal muscle %</b> — fat tissue holds much less water than muscle, so higher fat usually means lower water and muscle %.<br><br><b>Approximate reference ranges</b> (vary by age and sex):<br>Men: 10–20% healthy<br>Women: 18–28% healthy` },
  { key:'bodyWaterPct', label:'Agua corporal', unit:'%', info:'Es el porcentaje de tu peso que es agua — presente en sangre, músculos, órganos y piel. El músculo contiene mucha más agua que la grasa, así que este número tiende a subir cuando ganas músculo o pierdes grasa.<br><br>Se relaciona de forma inversa con tu <b>Grasa corporal %</b>: cuando uno sube, el otro suele bajar, aunque ambos cambien por la misma causa (más o menos grasa).<br><br><b>Rangos de referencia aproximados:</b><br>Hombres: 50–65%<br>Mujeres: 45–60%',
    infoEn:`This is the percentage of your weight that's water — present in blood, muscles, organs, and skin. Muscle holds far more water than fat, so this number tends to rise when you gain muscle or lose fat.<br><br>It's inversely related to your <b>Body fat %</b>: when one rises, the other usually falls, even though both change for the same reason (more or less fat).<br><br><b>Approximate reference ranges:</b><br>Men: 50–65%<br>Women: 45–60%` },
  { key:'skeletalMusclePct', label:'Músculo esquelético', unit:'%', info:'Es el porcentaje de tu peso que corresponde a músculo esquelético (el que mueves voluntariamente, sin contar músculo liso ni cardíaco).<br><br>Se relaciona directamente con tu <b>Masa muscular (kg)</b> y <b>Masa esquelética (kg)</b> (son la versión en kilos de este mismo dato), y con tu <b>Metabolismo basal</b>: más músculo significa que tu cuerpo quema más calorías en reposo.<br><br><b>Rangos de referencia aproximados:</b><br>Hombres: 33–39%<br>Mujeres: 24–30%<br><br>Mantenerlo o aumentarlo con el tiempo es especialmente importante después de los 40 años, cuando el cuerpo pierde músculo de forma natural (sarcopenia).',
    infoEn:`This is the percentage of your weight that's skeletal muscle (the kind you move voluntarily, not counting smooth or cardiac muscle).<br><br>It's directly related to your <b>Muscle mass (kg)</b> and <b>Skeletal mass (kg)</b> (the kilogram version of this same data), and to your <b>Basal metabolism</b>: more muscle means your body burns more calories at rest.<br><br><b>Approximate reference ranges:</b><br>Men: 33–39%<br>Women: 24–30%<br><br>Maintaining or increasing it over time is especially important after age 40, when the body naturally loses muscle (sarcopenia).` },
  { key:'bmr', label:'Metabolismo basal (MMR)', unit:'kcal', info:'Es la energía (en kcal) que tu cuerpo necesita solo para mantenerse vivo en reposo absoluto — respirar, mantener la temperatura, el corazón latiendo — sin contar ninguna actividad.<br><br>Depende directamente de tu <b>Músculo esquelético %</b> y <b>Masa muscular</b>: más músculo eleva tu metabolismo basal, porque el tejido muscular consume más energía en reposo que la grasa. VitaLinks usa este valor junto con tu ejercicio y comidas en la pestaña <b>Pronóstico</b> para estimar tu balance calórico.<br><br>No hay un "número meta" único — depende de tu edad, sexo, peso y composición — pero aumentarlo indirectamente (ganando músculo) ayuda a quemar más calorías incluso en descanso.',
    infoEn:`This is the energy (in kcal) your body needs just to stay alive at complete rest — breathing, maintaining temperature, your heart beating — without counting any activity.<br><br>It depends directly on your <b>Skeletal muscle %</b> and <b>Muscle mass</b>: more muscle raises your basal metabolism, because muscle tissue burns more energy at rest than fat. VitaLinks uses this value along with your exercise and meals in the <b>Forecast</b> tab to estimate your calorie balance.<br><br>There's no single "target number" — it depends on your age, sex, weight, and composition — but raising it indirectly (by gaining muscle) helps you burn more calories even at rest.` },
  { key:'fatLossKg', label:'Pérdida de grasa', unit:'kg', info:'Es el cambio estimado en tu grasa corporal (en kg) que calcula la báscula, comparando con una medición de referencia anterior.<br><br>Se relaciona con tu <b>Grasa corporal %</b> y <b>Grasa visceral</b> — si estos bajan con el tiempo, este valor debería reflejar una pérdida de grasa acumulada.<br><br>Un ritmo saludable de pérdida de grasa es de aproximadamente <b>0.5% a 1% de tu peso corporal por semana</b> — perder más rápido suele significar pérdida de músculo y agua, no solo grasa.',
    infoEn:`This is the estimated change in your body fat (in kg) that the scale calculates, compared against an earlier reference measurement.<br><br>It's related to your <b>Body fat %</b> and <b>Visceral fat</b> — if those drop over time, this value should reflect accumulated fat loss.<br><br>A healthy rate of fat loss is roughly <b>0.5% to 1% of your body weight per week</b> — losing faster usually means losing muscle and water, not just fat.` },
  { key:'subcutaneousFatPct', label:'Grasa subcutánea', unit:'%', info:'Es la grasa que está justo debajo de la piel — la que puedes pellizcar — y representa la mayor parte de tu grasa corporal total. Es distinta de la grasa visceral, que rodea tus órganos internos.<br><br>Junto con tu <b>Grasa visceral</b>, forma aproximadamente tu <b>Grasa corporal %</b> total. Es menos riesgosa para la salud metabólica que la grasa visceral, pero en exceso también refleja sobrepeso general.<br><br>No tiene un rango universal estandarizado como otros parámetros — lo más útil es ver su tendencia junto con tu Grasa corporal % general: si uno baja, el otro normalmente también.',
    infoEn:`This is the fat right beneath your skin — the kind you can pinch — and it makes up most of your total body fat. It's distinct from visceral fat, which surrounds your internal organs.<br><br>Together with your <b>Visceral fat</b>, it roughly adds up to your total <b>Body fat %</b>. It carries less metabolic health risk than visceral fat, but in excess it still points to overall excess weight.<br><br>It doesn't have a standardized universal range like other parameters — the most useful thing is watching its trend alongside your overall Body fat %: if one drops, the other usually does too.` },
  { key:'heartRate', label:'Frecuencia cardíaca', unit:'bpm', info:'Es tu frecuencia cardíaca (latidos por minuto) en el momento exacto de la medición — no necesariamente en reposo total.<br><br>Se relaciona con tu <b>Índice cardíaco</b>: juntos indican cuánta sangre está bombeando tu corazón. Una frecuencia en reposo baja suele ser señal de buena condición cardiovascular (común en personas entrenadas).<br><br><b>Rango normal en reposo para adultos:</b> 60–100 bpm (atletas entrenados pueden estar por debajo, 40–60 bpm).<br><br>Si ves lecturas consistentemente fuera de este rango, especialmente por encima de 100 en reposo, vale la pena comentarlo con un médico.',
    infoEn:`This is your heart rate (beats per minute) at the exact moment of measurement — not necessarily at complete rest.<br><br>It's related to your <b>Cardiac index</b>: together they show how much blood your heart is pumping. A low resting rate is usually a sign of good cardiovascular fitness (common in trained athletes).<br><br><b>Normal resting range for adults:</b> 60–100 bpm (trained athletes can be lower, 40–60 bpm).<br><br>If you see readings consistently outside this range, especially above 100 at rest, it's worth mentioning to a doctor.` },
  { key:'cardiacIndex', label:'Índice cardíaco', unit:'L/min/m²', info:'Mide cuánta sangre bombea tu corazón por minuto, ajustado a tu tamaño corporal (superficie corporal). Es un parámetro más clínico que los demás.<br><br>Se relaciona directamente con tu <b>Frecuencia cardíaca</b> — ambos reflejan el desempeño de tu sistema cardiovascular en el momento de la medición.<br><br><b>Rango normal de referencia:</b> aproximadamente 2.5 – 4.0 L/min/m² en reposo.<br><br>Valores fuera de este rango no son necesariamente alarmantes por sí solos, pero si se repiten de forma consistente, es un buen dato para compartir con un médico — este parámetro suele usarse en contextos clínicos, no solo de fitness.',
    infoEn:`This measures how much blood your heart pumps per minute, adjusted for your body size (body surface area). It's a more clinical parameter than the others.<br><br>It's directly related to your <b>Heart rate</b> — together they reflect how your cardiovascular system is performing at the moment of measurement.<br><br><b>Normal reference range:</b> roughly 2.5 – 4.0 L/min/m² at rest.<br><br>Values outside this range aren't necessarily alarming on their own, but if they show up consistently, it's worth sharing with a doctor — this parameter is typically used in clinical settings, not just fitness.` },
  { key:'visceralFat', label:'Grasa visceral', unit:'', info:'Mide la grasa acumulada alrededor de tus órganos internos (abdomen) en una escala de nivel (no porcentaje). Es el tipo de grasa más relacionado con riesgo metabólico — más que la grasa subcutánea.<br><br>Se relaciona con tu <b>Grasa corporal %</b> e <b>IMC</b>, pero es un indicador más específico: puedes tener un IMC normal y aun así tener grasa visceral alta ("delgado por fuera, graso por dentro").<br><br><b>Niveles de referencia (escala típica 1–59):</b><br>1–9: normal<br>10–14: alto<br>15 o más: muy alto (mayor riesgo de diabetes tipo 2 y enfermedad cardiovascular)<br><br><b>Meta recomendada:</b> mantenerlo por debajo de 10.',
    infoEn:`This measures the fat built up around your internal organs (abdomen) on a level scale (not a percentage). It's the type of fat most linked to metabolic risk — more so than subcutaneous fat.<br><br>It's related to your <b>Body fat %</b> and <b>BMI</b>, but it's a more specific indicator: you can have a normal BMI and still have high visceral fat ("skinny outside, fat inside").<br><br><b>Reference levels (typical 1–59 scale):</b><br>1–9: normal<br>10–14: high<br>15 or above: very high (higher risk of type 2 diabetes and cardiovascular disease)<br><br><b>Recommended target:</b> keep it below 10.` },
  { key:'muscleMassKg', label:'Masa muscular', unit:'kg', info:'Es el peso total (en kg) de todo tu tejido muscular — esquelético, liso y cardíaco combinados, según el algoritmo de tu báscula.<br><br>Se relaciona directamente con tu <b>Músculo esquelético %</b> (ese es el porcentaje de esto mismo) y con tu <b>Metabolismo basal</b> — más masa muscular significa más calorías quemadas en reposo.<br><br>No hay un número meta universal — depende de tu estatura, sexo y objetivo — pero mantenerlo estable o creciente con el tiempo (especialmente con entrenamiento de fuerza) es una señal positiva, sobre todo si estás en un proceso de pérdida de peso, donde quieres perder grasa sin perder músculo.',
    infoEn:`This is the total weight (in kg) of all your muscle tissue — skeletal, smooth, and cardiac combined, according to your scale's algorithm.<br><br>It's directly related to your <b>Skeletal muscle %</b> (that's the percentage version of this same data) and to your <b>Basal metabolism</b> — more muscle mass means more calories burned at rest.<br><br>There's no universal target number — it depends on your height, sex, and goal — but keeping it stable or growing over time (especially with strength training) is a good sign, particularly if you're losing weight and want to lose fat without losing muscle.` },

// Chart color grouped by what each metric actually measures — not a rotating
// index — so related fields share a color and none of them lands on
// var(--danger) by coincidence (that color is reserved for genuinely
// concerning readings, e.g. an out-of-range BP badge).
const BODYCOMP_COLOR_BY_KEY = {
  bmi:'var(--accent)', bodyFatPct:'var(--accent)', bodyWaterPct:'var(--accent)',
  subcutaneousFatPct:'var(--accent)', visceralFat:'var(--accent)', fatLossKg:'var(--accent)', bodyAge:'var(--accent)',
  skeletalMusclePct:'var(--accent3)', bmr:'var(--accent3)', muscleMassKg:'var(--accent3)',
  skeletalMassKg:'var(--accent3)', proteinPct:'var(--accent3)',
  heartRate:'var(--accent2)', cardiacIndex:'var(--accent2)',
};
// Groups the long scale-reading form into scannable sections instead of one flat list.
const BODYCOMP_GROUPS = {
  bmi:'corporal', bodyFatPct:'corporal', bodyWaterPct:'corporal',
  skeletalMusclePct:'corporal', subcutaneousFatPct:'corporal', visceralFat:'corporal',
  muscleMassKg:'corporal', skeletalMassKg:'corporal', proteinPct:'corporal',
  heartRate:'cardio', cardiacIndex:'cardio',
  bmr:'metabolismo', fatLossKg:'metabolismo', bodyAge:'metabolismo',
};
function groupedBodyCompFields(){
  const order = [];
  const map = {};
  BODYCOMP_FIELDS.forEach(f=>{
    const g = BODYCOMP_GROUPS[f.key] || 'otros';
    if(!map[g]){ map[g] = []; order.push(g); }
    map[g].push(f);
  });
  return order.map(groupKey=>({ groupKey, fields: map[groupKey] }));
}
function bcUnit(f){ return f.key==='bodyAge' ? (state.lang==='en'?'years':'años') : f.unit; }
function bcInfo(f){ return state.lang==='en' ? (f.infoEn||f.info) : f.info; }
// Physically-possible bounds for hard input validation — deliberately much wider
// than BODYCOMP_RANGES above, which flags "unhealthy," not "impossible." These

const BODYCOMP_LIMITS = {

// General adult reference bands, not personalized by sex/age. Fields without a
// universally-agreed target (bmr, fatLossKg, muscleMassKg, skeletalMassKg,

const BODYCOMP_RANGES = {

function bodyCompStatus(key, v){
  const r = BODYCOMP_RANGES[key];
  if(!r || v==null) return null;

/* ================= birth date wheel picker ================= */
const WHEEL_ITEM_H = 36;
function birthYearOptions(){
  const nowY = new Date().getFullYear();
  return ['–', ...Array.from({length:96}).map((_,i)=>nowY-5-i)];
}
function birthMonthOptions(){
  return ['–', ...monthLabels().map(m=>m.slice(0,3))];
}
function birthDayOptions(monthIdx, yearIdx){
  const years = birthYearOptions(), months = birthMonthOptions();
  if(monthIdx<=0 || yearIdx<=0) return ['–', ...Array.from({length:31}).map((_,i)=>i+1)];
  const daysInMonth = new Date(years[yearIdx], monthIdx, 0).getDate();
  return ['–', ...Array.from({length:daysInMonth}).map((_,i)=>i+1)];
}
function initBirthWheel(){
  if(window._birthDateWheel) return window._birthDateWheel;
  const cfg = getForecastConfig();
  if(cfg.birthDate){
    const [y,m,d] = cfg.birthDate.split('-').map(Number);
    const years = birthYearOptions();
    const yearIdx = years.indexOf(y);
    const monthIdx = m;
    const days = birthDayOptions(monthIdx, yearIdx>=0?yearIdx:0);
    const dayIdx = days.indexOf(d);
    window._birthDateWheel = { dayIdx: dayIdx>=0?dayIdx:0, monthIdx, yearIdx: yearIdx>=0?yearIdx:0 };
  } else {
    window._birthDateWheel = { dayIdx:0, monthIdx:0, yearIdx:0 };
  }
  return window._birthDateWheel;
}
function ageFromBirthDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const today = new Date();
  let age = today.getFullYear() - y;
  const hadBirthdayThisYear = (today.getMonth()+1 > m) || (today.getMonth()+1===m && today.getDate()>=d);
  if(!hadBirthdayThisYear) age--;
  return age;
}
function currentBirthDateFromWheel(){
  const w = initBirthWheel();
  if(!w.dayIdx || !w.monthIdx || !w.yearIdx) return null;
  const years = birthYearOptions();
  const days = birthDayOptions(w.monthIdx, w.yearIdx);
  const y = years[w.yearIdx], m = w.monthIdx, d = days[w.dayIdx];
  if(d==null) return null;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function birthAgeDisplayHTML(){
  const iso = currentBirthDateFromWheel();
  return iso ? trf('pron_edad',{n:ageFromBirthDate(iso)}) : '';
}
function wheelColHTML(key, options, selectedIdx){
  return `<div class="wheel-col" id="wheel-${key}" onscroll="onWheelScroll('${key}')">
    ${options.map((opt,i)=>`<div class="wheel-item ${i===selectedIdx?'selected':''}" onclick="selectWheelItem('${key}',${i})">${opt}</div>`).join('')}
  </div>`;
}
function birthWheelHTML(){
  const w = initBirthWheel();
  const days = birthDayOptions(w.monthIdx, w.yearIdx);
  const months = birthMonthOptions();
  const years = birthYearOptions();
  if(w.dayIdx >= days.length) w.dayIdx = w.dayIdx===0 ? 0 : days.length-1;
  return `
    <div class="wheel-wrap">
      <div class="wheel-highlight"></div>
      <div class="wheel-row">
        ${wheelColHTML('day', days, w.dayIdx)}
        ${wheelColHTML('month', months, w.monthIdx)}
        ${wheelColHTML('year', years, w.yearIdx)}
      </div>
    </div>
    <div id="birth-age-display" style="font-size:11px;color:var(--accent3);margin-top:8px;text-align:center;min-height:14px;">${birthAgeDisplayHTML()}</div>`;
}
function restoreWheelScroll(){
  const w = window._birthDateWheel;
  if(!w) return;
  ['day','month','year'].forEach(key=>{
    const el = document.getElementById('wheel-'+key);
    if(!el) return;
    const idx = w[key+'Idx'] || 0;
    el.scrollTop = idx * WHEEL_ITEM_H;
  });
}
// Shared by both the debounced scroll-settle and a direct tap on a row — a tap
// animates to center (it's a discrete, deliberate jump), a scroll just
// snap-corrects instantly (it's already basically there from momentum).
// Updates the DOM directly rather than a full render() so it doesn't fight
// scroll momentum on the other two columns or reset unrelated form fields.
function settleWheelAt(key, idx, smooth){
  const el = document.getElementById('wheel-'+key);
  if(!el) return;
  const w = initBirthWheel();
  const maxIdx = (key==='day' ? birthDayOptions(w.monthIdx,w.yearIdx) : key==='month' ? birthMonthOptions() : birthYearOptions()).length - 1;
  idx = Math.max(0, Math.min(maxIdx, idx));
  if(smooth) el.scrollTo({top: idx*WHEEL_ITEM_H, behavior:'smooth'});
  else el.scrollTop = idx * WHEEL_ITEM_H;
  w[key+'Idx'] = idx;
  [...el.children].forEach((child,i)=>child.classList.toggle('selected', i===idx));
  if(key==='month' || key==='year'){
    const days = birthDayOptions(w.monthIdx, w.yearIdx);
    if(w.dayIdx >= days.length) w.dayIdx = w.dayIdx===0 ? 0 : days.length-1;
    const dayEl = document.getElementById('wheel-day');
    if(dayEl){
      dayEl.innerHTML = days.map((opt,i)=>`<div class="wheel-item ${i===w.dayIdx?'selected':''}" onclick="selectWheelItem('day',${i})">${opt}</div>`).join('');
      dayEl.scrollTop = w.dayIdx * WHEEL_ITEM_H;
    }
  }
  const ageEl = document.getElementById('birth-age-display');
  if(ageEl) ageEl.textContent = birthAgeDisplayHTML();
}
function onWheelScroll(key){
  const el = document.getElementById('wheel-'+key);
  if(!el) return;
  clearTimeout(window['_wheelScrollTimer_'+key]);
  window['_wheelScrollTimer_'+key] = setTimeout(()=>{
    const idx = Math.round(el.scrollTop / WHEEL_ITEM_H);
    settleWheelAt(key, idx, false);
  }, 120);
}
function selectWheelItem(key, idx){
  settleWheelAt(key, idx, true);
}

}
function normalizeFoodKey(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' '); }
function rekeyByLabel(raw, getLabel){
  const fixed = {};
  let dirty = false;
  Object.keys(raw).forEach(k=>{
    const entry = raw[k];
    const properKey = normalizeFoodKey(getLabel(entry));
    if(properKey !== k) dirty = true;
    if(!fixed[properKey] || (entry.ts||0) > (fixed[properKey].ts||0)) fixed[properKey] = entry;
  });
  return { fixed, dirty };
}
// One-time backfill: older entries added before a history feature existed only ever
// got written into that day's own record, never into the shared suggestion cache.
// Walk every saved day and fill in anything still missing, without touching entries
// the cache already has (those stay authoritative, including any newer edits).
function backfillFromDays(existing, extractItems, buildEntry){
  let dirty = false;
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(!k || !k.startsWith('vl:day:')) continue;
    const iso = k.slice('vl:day:'.length);
    let day;
    try{ day = JSON.parse(localStorage.getItem(k)); }catch{ continue; }
    if(!day) continue;
    extractItems(day).forEach(item=>{
      const key = normalizeFoodKey(item.name);
      if(!key || existing[key]) return;
      const ts = Date.parse(`${iso}T${item.time||'00:00'}:00`) || 0;
      existing[key] = buildEntry(item, ts);
      dirty = true;
    });
  }
  return dirty;
}
function getNutritionCache(){
  const raw = LS.get('vl:nutrition-cache') || {};
  const { fixed, dirty } = rekeyByLabel(raw, e=>e.label);
  const backfilled = backfillFromDays(fixed, day=>day.meals||[], (item, ts)=>({
    label: item.name, calories: item.calories||0, protein: item.protein||0, carbs: item.carbs||0, fat: item.fat||0,
    fiber: item.fiber||0, sugar: item.sugar||0, sodium: item.sodium||0, iron: item.iron||0, calcium: item.calcium||0,
    potassium: item.potassium||0, vitaminC: item.vitaminC||0, note: '', ts
  }));
  if(dirty || backfilled) setNutritionCache(fixed);
  return fixed;
}
function setNutritionCache(c){ return LS.set('vl:nutrition-cache', c); }
function rememberNutrition(name, entry){
  const cache = getNutritionCache();
  const key = normalizeFoodKey(name);
  if(!key) return;
  cache[key] = { label: name.trim(), calories: entry.calories, protein: entry.protein||0, carbs: entry.carbs||0, fat: entry.fat||0,
    fiber: entry.fiber||0, sugar: entry.sugar||0, sodium: entry.sodium||0, iron: entry.iron||0, calcium: entry.calcium||0, potassium: entry.potassium||0, vitaminC: entry.vitaminC||0,
    note: entry.note||'', ts: Date.now() };
  setNutritionCache(cache);
}
function getExerciseHistory(){
  const raw = LS.get('vl:exercise-history') || {};
  const { fixed, dirty } = rekeyByLabel(raw, e=>e.label);

    label: item.name, minutes: item.minutes||0, calories: item.calories||0, ts

}
function setExerciseHistory(h){ return LS.set('vl:exercise-history', h); }
function rememberExercise(name, minutes, calories){

  setExerciseHistory(hist);
}

/* ================= nutrition AI estimate ================= */
async function estimateNutrition(desc){
  const key = getApiKey();
  if(!key) throw new Error(tr('err_ai_key_missing'));
  const prompt = `Eres un nutricionista. Estima el contenido nutricional para el siguiente alimento, considerando la cantidad/porción indicada, usando valores nutricionales típicos (USDA u equivalente). Si la porción no se especifica, asume una porción individual estándar. Responde ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin markdown, sin backticks:
{"calories": <entero kcal>, "protein": <entero g>, "carbs": <entero g>, "fat": <entero g>, "fiber": <entero g>, "sugar": <entero g>, "sodium": <entero mg>, "iron": <entero mg>, "calcium": <entero mg>, "potassium": <entero mg>, "vitaminC": <entero mg>, "note": "<nota breve en español, max 10 palabras>"}

Alimento: "${desc}"`;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:300, messages:[{role:'user', content:prompt}] })
  });
  if(!res.ok){ const t = await res.text(); throw new Error('API error: '+t.slice(0,200)); }
  const data = await res.json();

function getDailyInsightCache(){ return LS.get('vl:insight-cache') || {}; }
function setDailyInsightCache(c){ return LS.set('vl:insight-cache', c); }
async function generateDailyInsight(force){
  const iso = todayISO();
  const cache = getDailyInsightCache();
  if(!force && cache[iso]) return cache[iso];
  const key = getApiKey();
  if(!key) throw new Error(tr('err_ai_key_missing'));

  const d = state.day, g = state.goals;
  const calEaten = d.meals.reduce((s,m)=>s+(Number(m.calories)||0),0);
  const exMin = d.exercises.reduce((s,e)=>s+(Number(e.minutes)||0),0);
  const lastBP = d.bp[d.bp.length-1];
  const score = vitalityScore();
  const weightHist = getWeightHistory(7);
  const weightTrend = weightHist.length>=2 ? (weightHist[weightHist.length-1].weight - weightHist[0].weight) : null;
  const adherence = state.meds.length>0 ? medAdherence(7) : null;

  const context = [
    score!=null ? `Puntaje de vitalidad hoy: ${score}/100` : null,
    `Calorías: ${calEaten} de meta ${g.calorieGoal} kcal`,
    `Agua: ${d.water} de meta ${g.waterGoal} vasos`,
    `Ejercicio: ${exMin} de meta ${g.exerciseGoal} min`,
    d.sleepHours!=null ? `Sueño: ${d.sleepHours} h` : null,
    lastBP ? `Presión: ${lastBP.systolic}/${lastBP.diastolic} mmHg (${bpCategory(lastBP.systolic,lastBP.diastolic).label})` : null,
    adherence!=null ? `Adherencia a medicamentos (7 días): ${adherence}%` : null,
    weightTrend!=null ? `Cambio de peso (7 días): ${weightTrend>0?'+':''}${weightTrend.toFixed(1)} kg` : null,
  ].filter(Boolean).join('\n');

  const prompt = `Eres un asistente de salud breve y alentador, nunca clínico ni alarmista. Con base en estos datos del día de un usuario, escribe UNA sola frase corta (máximo 20 palabras) en español, observando un patrón real de los datos o dando ánimo específico. No repitas los números tal cual, interprétalos. No des consejo médico. No uses signos de exclamación en exceso.

Datos de hoy:
${context}

Responde solo con la frase, sin comillas ni explicación adicional.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:100, messages:[{role:'user', content:prompt}] })
  });
  if(!res.ok){ const t = await res.text(); throw new Error('API error: '+t.slice(0,200)); }
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.text||'').join('').trim();
  cache[iso] = text;
  setDailyInsightCache(cache);
  return text;
}
async function handleGenerateInsight(force){
  const btn = document.getElementById('insight-btn');
  const errEl = document.getElementById('insight-error');
  if(btn){ btn.disabled = true; btn.textContent = 'Generando…'; }
  if(errEl) errEl.textContent = '';

    if(errEl) errEl.textContent = e.message || 'No se pudo generar el insight';

function getBarcodeCache(){ return LS.get('vl:barcode-cache') || {}; }
function setBarcodeCache(c){ return LS.set('vl:barcode-cache', c); }

function openScanner(target){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    toast(tr('err_camera_unsupported'), true); return;
  }
  if(typeof ZXing === 'undefined'){
    toast(tr('err_barcode_lib_failed'), true); return;
  }
  window._scanBusy = false;
  window._scanTarget = target || 'meal';
  window._modal = 'scanner';
  render();
  startScanner();
}
function startScanner(){
  const codeReader = new ZXing.BrowserMultiFormatReader();
  window._scannerReader = codeReader;
  // The status line starts neutral (not "point at a barcode") until the video
  // feed actually confirms it's live. A timeout also covers the case where
  // getUserMedia's promise never settles at all (e.g. a permission prompt the
  // user never responds to) — without it, this screen can otherwise get stuck
  // indefinitely with no error and no way forward except Cancelar.
  clearTimeout(window._scannerTimeout);
  window._scannerTimeout = setTimeout(()=>{
    const statusEl = document.getElementById('scanner-status');
    if(statusEl) statusEl.textContent = tr('scan_timeout');
  }, 9000);
  codeReader.decodeFromConstraints(
    { video: { facingMode: { ideal: 'environment' } } },
    'scanner-video',
    (result) => { if(result) handleScanResult(result.getText()); }
  ).catch(err=>{
    clearTimeout(window._scannerTimeout);
    const statusEl = document.getElementById('scanner-status');
    if(statusEl) statusEl.textContent = 'No se pudo acceder a la cámara: ' + (err.message||err);
  });
  const videoEl = document.getElementById('scanner-video');
  if(videoEl){
    videoEl.addEventListener('loadedmetadata', ()=>{
      clearTimeout(window._scannerTimeout);
      const statusEl = document.getElementById('scanner-status');
      if(statusEl) statusEl.textContent = tr('scan_apunta');
    }, { once:true });
  }
}
function stopScanner(){
  clearTimeout(window._scannerTimeout);
  if(window._scannerReader){
    try{ window._scannerReader.reset(); }catch(e){}
    window._scannerReader = null;
  }
}
function closeScanner(e){
  if(e && e.target!==e.currentTarget) return;
  stopScanner();
  window._modal = null;
  render();
}
function handleScanResult(text){
  if(window._scanBusy) return;
  window._scanBusy = true;
  stopScanner();
  window._modal = null;
  render();
  lookupBarcode(text);
}

async function fetchOFF(code){
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,code`);
    if(!res.ok) return null;
    const data = await res.json();
    if(data.status!==1 || !data.product) return null;
    return parseOFFProduct(data.product);
  }catch(e){ return null; }
}
function pickGramField(n, key){ const v = n[key+'_100g']; return typeof v==='number' ? Math.round(v) : 0; }
function pickMgField(n, key){ const v = n[key+'_100g']; return typeof v==='number' ? Math.round(v*1000) : 0; }
function parseOFFProduct(p){

  const kcal = n['energy-kcal_100g'] != null ? n['energy-kcal_100g'] : (n['energy_100g']!=null ? n['energy_100g']/4.184 : 0);
  return {
    label: name || ('Producto '+(p.code||'')),
    calories: Math.round(kcal||0),
    protein: pickGramField(n,'proteins'),
    carbs: pickGramField(n,'carbohydrates'),
    fat: pickGramField(n,'fat'),
    fiber: pickGramField(n,'fiber'),
    sugar: pickGramField(n,'sugars'),
    sodium: pickMgField(n,'sodium'),
    iron: pickMgField(n,'iron'),
    calcium: pickMgField(n,'calcium'),
    potassium: pickMgField(n,'potassium'),
    vitaminC: pickMgField(n,'vitamin-c'),

}
async function lookupBarcode(barcode){

/* ================= tiny SVG chart helpers ================= */
function svgPathThroughValid(xy){
  let started = false;
  return xy.map(pt=>{
    if(!pt) return '';
    const cmd = started ? 'L' : 'M';
    started = true;
    return `${cmd}${pt[0]},${pt[1]}`;
  }).join(' ');
}
function gridDecimals(range, steps){
  // When the gap between gridlines is small, rounding every value to an integer can
  // make neighboring gridlines collapse to the same displayed label (e.g. two "141 kg"
  // lines in a row) — so scale decimal precision to how fine the steps actually are.
  const stepSize = range/(steps-1 || 1);
  return stepSize===0 ? 0 : stepSize < 0.1 ? 2 : stepSize < 1 ? 1 : 0;
}
// A rough (font isn't measured directly, but close enough to size a margin) estimate
// of how wide the widest Y-axis label will render, so callers can give the axis
// numbers their own gutter instead of sharing space with the plotted line/bars —
// a fixed left margin was only ever wide enough for the short *day* labels, not
// for values like "1877", so the line visibly cut through the numbers. The unit
// itself isn't part of this: it's printed once near the top of the axis instead
// of on every tick, precisely so it doesn't add to this width.
function estimateAxisLabelWidth(min, range, steps){
  const decimals = gridDecimals(range, steps);
  let maxLen = 0;
  for(let i=0;i<steps;i++){
    const val = min + (i/(steps-1||1))*range;
    maxLen = Math.max(maxLen, val.toFixed(decimals).length);
  }
  return maxLen * 15 * 0.58; // font-size 15, ~0.58 average character width
}
function refGridSVG(min, range, w, h, padL, pad, steps, unit){
  const decimals = gridDecimals(range, steps);
  const lines = [];
  const labels = [];
  for(let i=0;i<steps;i++){
    const frac = i/(steps-1);
    const val = min + frac*range;
    const y = h-pad-frac*(h-pad*2);
    lines.push(`<line x1="${padL}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="var(--line)" stroke-dasharray="3,3"/>`);
    labels.push(`<text x="2" y="${y+3}" font-size="15" fill="var(--muted)">${val.toFixed(decimals)}</text>`);
  }
  // The unit prints once, near the top of the axis, instead of repeating on
  // every tick — that repetition was most of what made these labels wide
  // enough to collide with the plotted line in the first place.
  if(unit) labels.push(`<text x="2" y="14" font-size="11" fill="var(--muted)">${unit}</text>`);
  // Split so callers can draw the dashed reference lines behind the plotted data
  // but the numeric labels after it — otherwise the line/dots paint over the
  // numbers wherever a value happens to pass near the left edge.
  return { lines: lines.join(''), labels: labels.join('') };
}
function lineChartSVG(points, opts){
  const w = opts.w||520, h = opts.h||150, pad=28;
  const vals = points.map(p=>p.v).filter(v=>v!=null);
  if(vals.length < 2) return `<div style="color:var(--muted);font-size:12px;padding:20px;text-align:center;">${opts.emptyMsg||tr('chart_no_data')}</div>`;
  let min = Math.min(...vals), max = Math.max(...vals);
  if(opts.targetValue!=null){ min = Math.min(min, opts.targetValue); max = Math.max(max, opts.targetValue); }
  if(opts.maValues){ const maVals = opts.maValues.filter(v=>v!=null); if(maVals.length){ min = Math.min(min, ...maVals); max = Math.max(max, ...maVals); } }
  const range = (max-min)||1;
  // A dedicated left gutter, sized to the actual Y-axis text, so the plotted line
  // starts to the right of the numbers instead of passing behind/through them.
  const padL = opts.gridLines ? Math.max(pad, estimateAxisLabelWidth(min, range, opts.gridSteps||4)+10) : pad;
  const stepX = (w-padL-pad)/(points.length-1);
  const xy = points.map((p,i)=> p.v==null ? null : [padL+i*stepX, h-pad-((p.v-min)/range)*(h-pad*2)]);
  const validPts = svgPathThroughValid(xy);
  const dots = xy.map((p,i)=> p ? `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${opts.color}"/>` : '').join('');
  // The leftmost label sits right at the edge of the Y-axis gutter — center-anchoring
  // it would extend back into that gutter, so it alone anchors from the start
  // (extends rightward only) instead of centering.
  const labels = points.map((p,i)=>`<text x="${padL+i*stepX}" y="${h-6}" font-size="15" fill="var(--muted)" text-anchor="${i===0?'start':'middle'}">${p.label}</text>`).join('');
  const grid = opts.gridLines ? refGridSVG(min, range, w, h, padL, pad, opts.gridSteps||4, opts.unit) : {lines:'',labels:''};
  const targetColor = opts.targetColor||'var(--accent2)';
  const targetY = opts.targetValue!=null ? h-pad-((opts.targetValue-min)/range)*(h-pad*2) : null;
  const targetLine = targetY!=null ? `<line x1="${padL}" y1="${targetY}" x2="${w-pad}" y2="${targetY}" stroke="${targetColor}" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="${w-pad-2}" y="${targetY-4}" font-size="15" fill="${targetColor}" text-anchor="end">Meta ${opts.targetValue}${opts.unit?' '+opts.unit:''}</text>` : '';
  const maPath = opts.maValues ? `<path d="${svgPathThroughValid(opts.maValues.map((v,i)=> v==null ? null : [padL+i*stepX, h-pad-((v-min)/range)*(h-pad*2)]))}" fill="none" stroke="${opts.maColor||opts.color}" stroke-width="1.6" stroke-dasharray="5,4" opacity="0.8"/>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">
    ${grid.lines}
    <line x1="${padL}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/>
    ${maPath}
    <path d="${validPts}" fill="none" stroke="${opts.color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${grid.labels}${labels}${targetLine}
  </svg>`;
}
function multiLineChartSVG(points, series, opts){
  const w = opts.w||520, h = opts.h||150, pad=28;
  const allVals = points.flatMap(p=>series.map(s=>p[s.key])).filter(v=>v!=null);
  const maVals = series.flatMap(s=>s.ma||[]).filter(v=>v!=null);
  if(allVals.length < 2) return `<div style="color:var(--muted);font-size:12px;padding:20px;text-align:center;">${opts.emptyMsg||tr('chart_no_data')}</div>`;
  const combined = allVals.concat(maVals);
  const min = Math.min(...combined), max = Math.max(...combined);
  const range = (max-min)||1;
  const padL = opts.gridLines ? Math.max(pad, estimateAxisLabelWidth(min, range, opts.gridSteps||4)+10) : pad;
  const stepX = (w-padL-pad)/(points.length-1);
  const paths = series.map(s=>{
    const xy = points.map((p,i)=> p[s.key]==null ? null : [padL+i*stepX, h-pad-((p[s.key]-min)/range)*(h-pad*2)]);
    const d = svgPathThroughValid(xy);
    const dots = xy.map(pt=> pt?`<circle cx="${pt[0]}" cy="${pt[1]}" r="3" fill="${s.color}"/>`:'').join('');
    const maPath = s.ma ? `<path d="${svgPathThroughValid(s.ma.map((v,i)=> v==null ? null : [padL+i*stepX, h-pad-((v-min)/range)*(h-pad*2)]))}" fill="none" stroke="${s.color}" stroke-width="1.6" stroke-dasharray="5,4" opacity="0.8"/>` : '';
    return `${maPath}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>${dots}`;
  }).join('');
  const labels = points.map((p,i)=>`<text x="${padL+i*stepX}" y="${h-6}" font-size="15" fill="var(--muted)" text-anchor="${i===0?'start':'middle'}">${p.label}</text>`).join('');
  const grid = opts.gridLines ? refGridSVG(min, range, w, h, padL, pad, opts.gridSteps||4, opts.unit) : {lines:'',labels:''};
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">
    ${grid.lines}
    <line x1="${padL}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/>
    ${paths}${grid.labels}${labels}
  </svg>`;
}
function barChartSVG(points, opts){
  const w = opts.w||520, h = opts.h||150, pad=28;
  // Some series here (sleep) can be genuinely unlogged (null) on a given day,
  // same as the line-chart metrics — distinct from series like calories/water/
  // exercise minutes that are always a real number (0 included) by construction.
  // Only bail to the text fallback when every point is truly unset, not when
  // they're all real zeros.
  if(points.every(p=>p.v==null)) return `<div style="color:var(--muted);font-size:12px;padding:20px;text-align:center;">${opts.emptyMsg||tr('chart_no_data')}</div>`;
  const vals = points.map(p=>p.v||0);
  const maVals = opts.maValues ? opts.maValues.filter(v=>v!=null) : [];
  const max = Math.max(...vals, ...maVals, opts.goal||0, 1);
  const padL = opts.gridLines ? Math.max(pad, estimateAxisLabelWidth(0, max, opts.gridSteps||4)+10) : pad;
  const stepX = (w-padL-pad)/points.length;
  const barW = stepX*0.55;
  const bars = points.map((p,i)=>{
    const bh = ((p.v||0)/max)*(h-pad*2);
    const x = padL+i*stepX + (stepX-barW)/2;
    const y = h-pad-bh;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="${opts.color}"/>`;
  }).join('');
  const goalY = opts.goal ? h-pad-(opts.goal/max)*(h-pad*2) : null;
  const goalLine = goalY!=null ? `<line x1="${padL}" y1="${goalY}" x2="${w-pad}" y2="${goalY}" stroke="var(--muted)" stroke-dasharray="4,4"/>` : '';
  // Bars are solid fills, so the MA overlay defaults to a neutral color rather than
  // matching the bar (a same-color dashed line on a same-color bar has poor contrast).
  const maPath = opts.maValues ? `<path d="${svgPathThroughValid(opts.maValues.map((v,i)=> v==null ? null : [padL+i*stepX+stepX/2, h-pad-(v/max)*(h-pad*2)]))}" fill="none" stroke="${opts.maColor||'var(--text)'}" stroke-width="1.6" stroke-dasharray="5,4" opacity="0.85"/>` : '';
  const labels = points.map((p,i)=>`<text x="${padL+i*stepX+stepX/2}" y="${h-6}" font-size="15" fill="var(--muted)" text-anchor="${i===0?'start':'middle'}">${p.label}</text>`).join('');
  const grid = opts.gridLines ? refGridSVG(0, max, w, h, padL, pad, opts.gridSteps||4, opts.unit) : {lines:'',labels:''};
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">
    ${grid.lines}
    <line x1="${padL}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/>
    ${goalLine}${bars}${maPath}${grid.labels}${labels}
  </svg>`;
}
function dialSVG(calPct, waterPct, exPct, size, responsive, animate){
  const s = size || 168;
  const scale = s/168;
  const rings = [
    { r:76*scale, pct:calPct, color:'var(--accent)' },
    { r:60*scale, pct:waterPct, color:'var(--accent3)' },
    { r:44*scale, pct:exPct, color:'var(--accent2)' },
  ];
  const cx = s/2;
  const strokeW = Math.max(2.5, 9*scale);
  const circles = rings.map(ring=>{
    const c = 2*Math.PI*ring.r; const clamped = Math.max(0, Math.min(1, ring.pct||0));
    const targetOffset = c*(1-clamped);
    return `<circle cx="${cx}" cy="${cx}" r="${ring.r}" fill="none" stroke="var(--ring-track)" stroke-width="${strokeW}"/>
    <circle class="${animate?'ring-fill-animate':''}" data-target-offset="${targetOffset}" cx="${cx}" cy="${cx}" r="${ring.r}" fill="none" stroke="${ring.color}" stroke-width="${strokeW}" stroke-linecap="round"
      stroke-dasharray="${c} ${c}" stroke-dashoffset="${animate?c:targetOffset}" transform="rotate(-90 ${cx} ${cx})"/>`;
  }).join('');
  const styleAttr = responsive ? ' style="width:100%;height:auto;display:block;"' : '';
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"${styleAttr}>${circles}</svg>`;
}
function weeklyGoalsCard(){

  const days = isos.map(iso => iso===todayISO() ? { iso, ...state.day } : { iso, ...getDay(iso) });
  let calSum = 0, waterSum = 0, exSum = 0;
  const dials = days.map(d=>{
    const calEaten = d.meals.reduce((s,m)=>s+(Number(m.calories)||0),0);
    const exMin = d.exercises.reduce((s,e)=>s+(Number(e.minutes)||0),0);
    const calPct = calEaten/g.calorieGoal;
    const waterPct = (d.water||0)/g.waterGoal;
    const exPct = exMin/g.exerciseGoal;
    calSum += clamp(calPct,0,1); waterSum += clamp(waterPct,0,1); exSum += clamp(exPct,0,1);
    const isToday = d.iso===todayISO();
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 1 auto;max-width:56px;min-width:0;">
      ${dialSVG(calPct, waterPct, exPct, 44, true)}
      <span style="font-size:11px;color:${isToday?'var(--accent)':'var(--muted)'};font-weight:${isToday?'700':'400'};">${dayLetter(d.iso)}</span>
    </div>`;
  }).join('');
  const avgStat = (color,label,pct)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;">
    <span class="display" style="font-size:17px;font-weight:700;color:${color};">${Math.round(pct/n*100)}%</span>
    <span style="font-size:10.5px;color:var(--muted);">${label}</span>
  </div>`;
  return `<div class="card">
    <div class="label" style="margin-bottom:2px;">${tr('hoy_metas_titulo')}</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:18px;">${tr('hoy_ultimos_7_dias')}</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">${dials}</div>
    <div style="display:flex;justify-content:space-between;gap:6px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);">
      ${avgStat('var(--accent3)', tr('legend_agua'), waterSum)}
      ${avgStat('var(--accent2)', tr('legend_ejercicio'), exSum)}
      ${avgStat('var(--accent)', tr('legend_comida'), calSum)}
    </div>
  </div>`;
}

function navIcon(key, size){ return `<svg class="ic-svg" style="${size?`width:${size}px;height:${size}px;`:''}" viewBox="0 0 24 24">${NAV_ICONS[key]||''}</svg>`; }
function renderApp(){
  const tabs = ['hoy','comidas','ejercicio','salud','composicion','calendario','progreso','nutricion','pronostico']
    .map(id=>({ id, label: tr('nav_'+id) }));
  const navBtns = tabs.map(t=>`
    <div class="navbtn ${state.tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      ${navIcon(t.id)}<span>${t.label}</span>
    </div>`).join('');

  const titles = Object.fromEntries(tabs.map(t=>[t.id, t.label]));
  const langToggle = `<div style="display:flex;gap:4px;">
    <button class="btn ${state.lang==='es'?'btn-primary':'btn-ghost'}" style="padding:5px 10px;font-size:11px;" onclick="setLang('es')">ES</button>
    <button class="btn ${state.lang==='en'?'btn-primary':'btn-ghost'}" style="padding:5px 10px;font-size:11px;" onclick="setLang('en')">EN</button>
  </div>`;

  return `
  <nav class="side">
    <div class="brand">
      <div>VitaLinks<div class="owner">Widy Medina</div></div>
      <svg class="brand-logo" viewBox="0 0 120 120">
        <rect width="120" height="120" rx="26" fill="var(--raised)"/>
        <defs>
          <mask id="bl-t" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect width="120" height="120" fill="white"/><circle cx="60" cy="80" r="34.641" fill="none" stroke="black" stroke-width="16"/></mask>
          <mask id="bl-o" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect width="120" height="120" fill="white"/><circle cx="77.32" cy="50" r="34.641" fill="none" stroke="black" stroke-width="16"/></mask>
          <mask id="bl-y" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect width="120" height="120" fill="white"/><circle cx="42.68" cy="50" r="34.641" fill="none" stroke="black" stroke-width="16"/></mask>
        </defs>
        <circle cx="77.32" cy="50" r="34.641" fill="none" stroke="var(--accent3)" stroke-width="10" mask="url(#bl-t)"/>
        <circle cx="42.68" cy="50" r="34.641" fill="none" stroke="var(--accent)" stroke-width="10" mask="url(#bl-o)"/>
        <circle cx="60" cy="80" r="34.641" fill="none" stroke="var(--accent2)" stroke-width="10" mask="url(#bl-y)"/>
      </svg>
    </div>
    ${navBtns}
    <div class="foot">
      <div class="navbtn" onclick="openSettings()">${navIcon('ajustes')}<span>${tr('nav_ajustes')}</span></div>
      <div class="navbtn" onclick="exportBackup()">${navIcon('exportar')}<span>${tr('nav_exportar')}</span></div>
      <div class="navbtn" onclick="triggerImportBackup()">${navIcon('importar')}<span>${tr('nav_importar')}</span></div>
      <input type="file" id="import-file-input" accept="application/json" style="display:none;" onchange="handleImportFile(this)">
    </div>
  </nav>
  <main>
    <header>
      <div>
        <h1>${window._pmView ? tr('pm_titulo') : titles[state.tab]}</h1>
        <div class="sub">${formatDateEs(todayISO())}</div>
      </div>
      ${langToggle}
    </header>
    ${state.toast ? `<div class="toast ${state.toast.isError?'':'ok'}">${esc(state.toast.msg)}</div>` : ''}
    ${renderTab()}
  </main>
  ${modalHTML()}
  `;
}
function renderTab(){
  if(window._pmView) return renderPersonalMealBuilder();
  switch(state.tab){
    case 'hoy': return renderHoy();
    case 'comidas': return renderComidas();
    case 'ejercicio': return renderEjercicio();
    case 'salud': return renderSalud();
    case 'composicion': return renderComposicion();
    case 'calendario': return renderCalendario();
    case 'progreso': return renderProgreso();
    case 'pronostico': return renderPronostico();
    case 'nutricion': return renderNutricion();
    default: return '';
  }
}

function renderHoy(){
  const d = state.day, g = state.goals;
  const calEaten = d.meals.reduce((s,m)=>s+(Number(m.calories)||0),0);
  const exMin = d.exercises.reduce((s,e)=>s+(Number(e.minutes)||0),0);
  const exCal = d.exercises.reduce((s,e)=>s+(Number(e.calories)||0),0);
  const lastBP = d.bp[d.bp.length-1];
  const vScore = vitalityScore();
  const todayInsight = getDailyInsightCache()[todayISO()];
  // Plays once when the tab is switched into (flag set by setTab/init), not on every
  // re-render while already on Hoy — otherwise logging a glass of water would replay
  // the whole entrance animation instead of just updating the ring instantly.
  const animateHoy = !!window._hoyAnimate;
  window._hoyAnimate = false;
  if(animateHoy) window._hoyAnimateTargets = { vitality: vScore, calories: calEaten };
  const vCirc = 2*Math.PI*52, vTargetOffset = vCirc*(1-clamp(vScore,0,100)/100);
  return `
  <div class="stack grid-desktop">
    ${vScore!=null ? `<div class="card" style="text-align:center;padding:22px;">
      <div class="label" style="margin-bottom:12px;">${tr('hoy_vitality')}</div>
      <div style="position:relative;width:120px;height:120px;margin:0 auto;">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--ring-track)" stroke-width="10"/>
          <circle class="${animateHoy?'ring-fill-animate':''}" data-target-offset="${vTargetOffset}" cx="60" cy="60" r="52" fill="none" stroke="${vScore>=75?'var(--status-good)':vScore>=50?'var(--status-warn)':'var(--danger)'}" stroke-width="10"
            stroke-dasharray="${vCirc} ${vCirc}" stroke-dashoffset="${animateHoy?vCirc:vTargetOffset}" stroke-linecap="round" transform="rotate(-90 60 60)"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <span class="display" id="vitality-num" style="font-size:34px;font-weight:700;">${animateHoy?0:vScore}</span>
        </div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:10px;">${tr('hoy_vitality_sub')}</div>
    </div>` : ''}
    ${vScore!=null ? `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div class="label" style="margin:0;display:flex;align-items:center;gap:6px;">${navIcon('sparkle',13)}${tr('hoy_insight')}</div>
        ${todayInsight ? `<button class="btn btn-ghost" style="padding:4px 10px;font-size:11px;display:inline-flex;align-items:center;gap:5px;" onclick="handleGenerateInsight(true)">${navIcon('refresh',12)}${tr('hoy_regenerar')}</button>` : ''}
      </div>
      ${todayInsight
        ? `<div style="font-size:14px;line-height:1.5;">${esc(todayInsight)}</div>`
        : `<button class="btn btn-primary" style="width:100%;" id="insight-btn" onclick="handleGenerateInsight(false)">${tr('hoy_generar_insight')}</button>`
      }
      <div id="insight-error" style="font-size:11px;color:var(--danger);margin-top:6px;"></div>
    </div>` : ''}
    <div class="card dial-wrap">
      <div style="position:relative;width:168px;height:168px;display:flex;align-items:center;justify-content:center;">
        ${dialSVG(calEaten/g.calorieGoal, d.water/g.waterGoal, exMin/g.exerciseGoal, undefined, undefined, animateHoy)}
        <div style="position:absolute;text-align:center;">
          <div class="display" id="dial-cal-num" style="font-size:30px;font-weight:700;">${animateHoy?0:calEaten}</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px;">${tr('hoy_de')} ${g.calorieGoal} kcal</div>
      <div class="legend">
        <span><span class="dot" style="background:var(--accent);"></span>${tr('legend_comida')}</span>
        <span><span class="dot" style="background:var(--accent3);"></span>${tr('legend_agua')}</span>
        <span><span class="dot" style="background:var(--accent2);"></span>${tr('legend_ejercicio')}</span>
      </div>
    </div>
    ${weeklyGoalsCard()}
    <div class="grid4 full-span">
      ${statTile(navIcon('calorias',14),tr('stat_quemadas'), exCal+' kcal')}
      ${statTile(navIcon('ejercicio',14),tr('stat_ejercicio'), exMin+' min')}
      ${statTile(navIcon('peso',14),tr('stat_peso'), d.weight? d.weight+' kg':'—')}
      ${statTile(navIcon('salud',14),tr('stat_presion'), lastBP? lastBP.systolic+'/'+lastBP.diastolic+(lastBP.pulse?' · '+lastBP.pulse+'bpm':'')+'<div style="margin-top:4px;">'+bpBadge(lastBP.systolic,lastBP.diastolic)+'</div>' : '—')}
    </div>
    ${macroCard(d.meals)}
    ${microCard(d.meals)}
    <div class="card full-span">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
        <div class="label" style="margin:0;">${tr('hoy_agua')}</div>
        <span class="display" style="font-size:13px;color:var(--accent3);font-weight:700;">${d.water} L</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;">
        ${Array.from({length:Math.max(g.waterGoal, d.water)}).map((_,i,arr)=>{
          // Every droplet except the last one jumps straight to its position (tap
          // droplet 3 -> water=3), same as before. The last droplet is the only
          // way to go *past* the goal: while it's the topmost filled droplet,
          // tapping it adds one more instead of un-filling it — otherwise there
          // was no way to log water beyond the goal at all, since a droplet only
          // exists here once water reaches it.
          const isLastAtMax = i===arr.length-1 && d.water>=arr.length;
          const nextValue = isLastAtMax ? d.water+1 : (i+1===d.water ? i : i+1);
          return `<button class="btn ${i<d.water?'btn-primary':'btn-ghost'}" style="width:44px;height:44px;padding:0;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;"
            onclick="setWater(${nextValue})">${navIcon('gota',19)}</button>`;
        }).join('')}
      </div>
      <div class="grid2">
        <div>
          <div class="label">${tr('hoy_peso')}</div>
          <input type="number" step="0.1" id="in-weight" value="${d.weight??''}" placeholder="—" style="width:100%;" onchange="setWeight(this.value)">
        </div>
        <div>
          <div class="label">${tr('hoy_sueno')}</div>
          <input type="number" step="0.1" id="in-sleep" value="${d.sleepHours??''}" placeholder="—" style="width:100%;" onchange="setSleep(this.value)">
        </div>
      </div>
    </div>
    <button class="btn btn-ghost full-span" style="border-style:dashed;" onclick="openSettings()">${navIcon('ajustes',14)}${tr('hoy_ajustar_metas')}</button>
  </div>`;
}
function statTile(ic,label,value){
  return `<div class="card" style="padding:14px;">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11px;color:var(--muted);">${ic} ${label}</div>
    <div class="display" style="font-size:17px;font-weight:700;">${value}</div>
  </div>`;
}
function macroSums(meals){
  return {
    protein: meals.reduce((s,m)=>s+(Number(m.protein)||0),0),
    carbs: meals.reduce((s,m)=>s+(Number(m.carbs)||0),0),
    fat: meals.reduce((s,m)=>s+(Number(m.fat)||0),0),
  };
}

  return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);">

function latestBodyCompValue(day, key){

/* ================= forecast (Pronóstico) ================= */
const KCAL_PER_KG = 7700; // approx. energy density of body fat, used to translate a calorie balance into a weight-change rate
function dayAt(iso){ return iso===todayISO() ? state.day : getDay(iso); }
function medAdherence(days){
  // Count against the medication schedule as configured *now* — a raw count of
  // medsTaken entries can include stale keys left behind by a deleted/renamed
  // med or a changed dose time (those entries never get cleaned up), which
  // inflates the total past 100% without a matching increase in doses expected.
  const doseSlots = state.meds.flatMap(m=>m.times.map(t=>m.id+':'+t));
  const dosesPerDay = doseSlots.length;
  if(dosesPerDay===0) return null;
  let taken=0;
  for(let n=0;n<days;n++){
    const takenKeys = new Set(dayAt(isoDaysAgo(n)).medsTaken.map(t=>t.key));
    taken += doseSlots.filter(slot=>takenKeys.has(slot)).length;
  }
  return Math.round((taken/(dosesPerDay*days))*100);
}
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function vitalityScore(){
  const d = state.day, g = state.goals;
  const parts = [];

  const calEaten = d.meals.reduce((s,m)=>s+(Number(m.calories)||0),0);
  if(g.calorieGoal>0 && calEaten>0) parts.push(clamp(100 - Math.abs(calEaten-g.calorieGoal)/g.calorieGoal*100, 0, 100));

  if(g.waterGoal>0 && d.water>0) parts.push(clamp((d.water/g.waterGoal)*100, 0, 100));

  const exMin = d.exercises.reduce((s,e)=>s+(Number(e.minutes)||0),0);
  if(g.exerciseGoal>0 && exMin>0) parts.push(clamp((exMin/g.exerciseGoal)*100, 0, 100));

  if(d.sleepHours!=null) parts.push(clamp(100 - Math.abs(d.sleepHours-8)*20, 0, 100));

  const lastBP = d.bp[d.bp.length-1];
  if(lastBP){
    const bpScores = {'Normal':100,'Elevada':75,'Hipertensión etapa 1':50,'Hipertensión etapa 2':25,'Crisis hipertensiva':0};
    parts.push(bpScores[bpCategory(lastBP.systolic, lastBP.diastolic).label] ?? 50);
  }

  const dosesPerDay = state.meds.reduce((s,m)=>s+m.times.length,0);
  if(dosesPerDay>0 && d.medsTaken.length>0) parts.push(clamp((d.medsTaken.length/dosesPerDay)*100, 0, 100));

  if(!parts.length) return null;
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function getWeightHistory(days){
  const isos = Array.from({length:days}).map((_,i)=>isoDaysAgo(days-1-i));
  return isos.map(iso=>({ iso, weight: dayAt(iso).weight })).filter(p=>p.weight!=null);
}
function linearTrendKgPerDay(points){
  if(points.length < 2) return null;
  const [fy,fm,fd] = points[0].iso.split('-').map(Number);
  const firstDate = new Date(fy,fm-1,fd);
  const xs = points.map(p=>{ const [y,m,d]=p.iso.split('-').map(Number); return (new Date(y,m-1,d)-firstDate)/86400000; });
  const ys = points.map(p=>p.weight);
  const n = xs.length;
  const sumX = xs.reduce((a,b)=>a+b,0), sumY = ys.reduce((a,b)=>a+b,0);
  const sumXY = xs.reduce((s,x,i)=>s+x*ys[i],0), sumXX = xs.reduce((s,x)=>s+x*x,0);
  const denom = n*sumXX - sumX*sumX;
  if(denom===0) return null;
  return (n*sumXY - sumX*sumY)/denom;
}
const PATTERN_MIN_N = 14;
// Raised from 0.3 after the UX audit found weak (0.3-0.5) correlations shown with
// the same visual confidence as well-established ones (e.g. sodium->BP sitting
// next to a likely-coincidental sleep->BP finding, both labeled "relación leve").
// At 0.5 every finding that clears the floor is at least "moderada" — fewer
// findings shown, but each one is a real relationship rather than sample noise.
const PATTERN_MIN_R = 0.5;
function pearsonR(xs, ys){
  const pairs = xs.map((x,i)=>[x, ys[i]]).filter(([x,y])=>x!=null && y!=null);
  const n = pairs.length;
  if(n < PATTERN_MIN_N) return null;
  const xv = pairs.map(p=>p[0]), yv = pairs.map(p=>p[1]);
  const sumX = xv.reduce((a,b)=>a+b,0), sumY = yv.reduce((a,b)=>a+b,0);
  const meanX = sumX/n, meanY = sumY/n;
  let num=0, sxx=0, syy=0;
  for(let i=0;i<n;i++){
    const dx = xv[i]-meanX, dy = yv[i]-meanY;
    num += dx*dy; sxx += dx*dx; syy += dy*dy;
  }
  // Zero variance in either side (e.g. a user who never misses a dose — constant 100%
  // adherence every day) makes the correlation mathematically undefined, not just noisy.
  if(sxx===0 || syy===0) return null;
  return { r: num/Math.sqrt(sxx*syy), n };
}
function getAvgDailyCaloriesConsumed(days){
  const isos = Array.from({length:days}).map((_,i)=>isoDaysAgo(days-1-i));
  const totals = isos.map(iso=>dayAt(iso).meals.reduce((s,m)=>s+(Number(m.calories)||0),0)).filter(v=>v>0);
  return totals.length ? totals.reduce((a,b)=>a+b,0)/totals.length : null;
}
function getAvgDailyExerciseBurn(days){
  const isos = Array.from({length:days}).map((_,i)=>isoDaysAgo(days-1-i));
  const totals = isos.map(iso=>dayAt(iso).exercises.reduce((s,e)=>s+(Number(e.calories)||0),0));
  return totals.reduce((a,b)=>a+b,0)/totals.length;

function getLatestBMR(){

    const v = latestBodyCompValue(dayAt(isoDaysAgo(n)), 'bmr');
    if(v!=null) return v;
  }

function getLatestWeight(){
  for(let n=0;n<=60;n++){
    const iso = isoDaysAgo(n);
    const w = dayAt(iso).weight;
    if(w!=null) return { iso, weight:w };
  }
