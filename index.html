function getFirstEverWeight(){
  let earliest = null;
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(!k || !k.startsWith('vl:day:')) continue;
    const iso = k.slice('vl:day:'.length);
    let day;
    try{ day = JSON.parse(localStorage.getItem(k)); }catch{ continue; }
    if(!day || day.weight==null) continue;
    if(!earliest || iso < earliest.iso) earliest = { iso, weight: day.weight };
  }
  if(state.day.weight!=null){
    const iso = todayISO();
    if(!earliest || iso < earliest.iso) earliest = { iso, weight: state.day.weight };
  }

function computeForecast(){
  const cfg = getForecastConfig();
  if(!cfg.heightCm || !cfg.targetWeightKg) return { status:'missing-config' };
  const latest = getLatestWeight();
  if(!latest) return { status:'no-weight', cfg };
  const remainingKg = latest.weight - cfg.targetWeightKg;
  const heightM = cfg.heightCm/100;
  const currentBMI = latest.weight/(heightM*heightM);
  const targetBMI = cfg.targetWeightKg/(heightM*heightM);
  if(Math.abs(remainingKg) < 0.1) return { status:'at-goal', cfg, latest, currentBMI, targetBMI };

  const history = getWeightHistory(30);
  let ratePerDay = null, method = null;
  if(history.length >= 4){
    ratePerDay = linearTrendKgPerDay(history);
    method = 'trend';
  }
  if(ratePerDay==null || Math.abs(ratePerDay) < 0.001){
    const bmr = getLatestBMR();
    const avgBurn = getAvgDailyExerciseBurn(14);
    const avgIntake = getAvgDailyCaloriesConsumed(14);
    if(bmr!=null && avgIntake!=null){
      ratePerDay = (avgIntake - (bmr+avgBurn)) / KCAL_PER_KG;
      method = 'calorie-balance';
    }
  }
  if(ratePerDay==null || Math.abs(ratePerDay) < 0.001){
    return { status:'insufficient-data', cfg, latest, currentBMI, targetBMI, remainingKg };
  }

  const needLoss = remainingKg > 0;
  const rateIsLoss = ratePerDay < 0;
  if(needLoss !== rateIsLoss){
    return { status:'wrong-direction', cfg, latest, currentBMI, targetBMI, remainingKg, ratePerDay, method };
  }
  const daysNeeded = Math.abs(remainingKg/ratePerDay);
  const etaDate = new Date(); etaDate.setDate(etaDate.getDate()+Math.round(daysNeeded));
  return { status:'ok', cfg, latest, currentBMI, targetBMI, remainingKg, ratePerDay, method, daysNeeded, etaDate };
}

function renderComposicionCharts(){
  const n = 30;
  const maWindow = 30;
  // Body composition is measured occasionally, not daily, so unlike the Nutrition
  // charts a trailing window can easily contain zero readings — the average there
  // must be over whatever samples exist in the window, not over 30 zero-padded days.
  const lookbackDays = n - 1 + maWindow;
  const bodyCompByDaysAgo = Array.from({length:lookbackDays}).map((_,daysAgo)=>dayAt(isoDaysAgo(daysAgo)).bodyComp || []);
  function valueAt(daysAgo, key){ return latestBodyCompValue({ bodyComp: bodyCompByDaysAgo[daysAgo] }, key); }
  function ma30(key){
    return Array.from({length:n}).map((_,i)=>{
      const daysAgo = n-1-i;
      let sum=0, count=0;
      for(let k=daysAgo; k<daysAgo+maWindow; k++){
        const v = valueAt(k, key);
        if(v!=null){ sum+=v; count++; }
      }
      return count>0 ? sum/count : null;
    });
  }
  const isos = Array.from({length:n}).map((_,i)=>isoDaysAgo(n-1-i));
  const exp = window._expandedCompChart;
  // 30 single-letter weekday labels in a row overlap illegibly — thin to every 5th.
  const axisLabel = (iso,idx) => idx%5===0 ? dayLetter(iso) : '';
  // Body comp has 14 fields but most users only ever log a handful of them —
  // showing all 14 as chart cards means scrolling past a dozen identical
  // "not enough data" placeholders to find the ones that actually have data.
  // Only render a card once a field has at least one real reading.
  const fieldsWithData = BODYCOMP_FIELDS.filter(f =>
    Array.from({length:n}).some((_,idx)=>valueAt(n-1-idx, f.key)!=null)
  );
  if(!fieldsWithData.length){
    return `<div style="font-size:12px;color:var(--muted);">${tr('comp_tendencia')}</div><div class="card" style="text-align:center;color:var(--muted);font-size:12px;padding:20px;">${tr('comp_sin_datos_grafico')}</div>`;
  }
  const charts = fieldsWithData.map((f)=>{
    const pts = isos.map((iso,idx)=>({ label:axisLabel(iso,idx), v: valueAt(n-1-idx, f.key) }));
    const ma = ma30(f.key);
    const isExp = exp===f.key;
    return `<div class="card expand-card ${isExp?'expanded':''}" onclick="toggleChartExpand('comp','${f.key}')"><div class="label" style="display:flex;align-items:center;gap:6px;justify-content:space-between;">
        <span>${tr('bc_'+f.key)}${f.unit?' ('+bcUnit(f)+')':''}</span>
        <button class="info-btn" onclick="event.stopPropagation();openBodyCompInfo('${f.key}')" title="${esc(tr('comp_info_title'))}">ⓘ</button>
      </div><div class="chart-box">${lineChartSVG(pts,{color:BODYCOMP_COLOR_BY_KEY[f.key], gridLines:true, gridSteps:isExp?5:4, unit:bcUnit(f), maValues:ma, h:isExp?320:150})}</div></div>`;
  }).join('');
  return `<div style="font-size:12px;color:var(--muted);">${tr('comp_tendencia')} · ${tr('nutr_ma30_nota')}</div><div class="grid2">${charts}</div>`;
}

function weightSummaryHTML(pts){

  if(valid.length < 2) return '';
  // Scoped to the selected range (pts already reflects it), not all-time —
  // otherwise this number wouldn't change when the 7/14/30-day toggle does.
  const first = valid[0].v, last = valid[valid.length-1].v;
  const change = last - first;
  const sign = change>0?'+':'';
  const targetKg = getForecastConfig().targetWeightKg;
  let color = 'var(--text)';
  let goalLine = '';
  if(targetKg){
    const dist = last - targetKg;
    const needLoss = dist > 0.05, needGain = dist < -0.05;
    const movingLoss = change < -0.05, movingGain = change > 0.05;
    const onTrack = (needLoss && movingLoss) || (needGain && movingGain);
    const offTrack = (needLoss && movingGain) || (needGain && movingLoss);
    color = onTrack ? 'var(--status-good)' : offTrack ? 'var(--danger)' : 'var(--text)';
    goalLine = Math.abs(dist)<0.05
      ? `<div style="font-size:10px;color:var(--accent3);display:flex;align-items:center;gap:4px;">${navIcon('logrado',12)}${tr('cal_en_meta')}</div>`

// Mifflin-St Jeor BMR — the standard formula used across fitness apps for a
// physiology-based calorie estimate (vs. a flat user-picked number).
function computeBMR(weightKg, heightCm, age, gender){
  const base = 10*weightKg + 6.25*heightCm - 5*age;
  if(gender==='m') return base + 5;
  if(gender==='f') return base - 161;
  return base - 78; // average of the male/female offsets when gender is 'o' or unset
}
// Derives an activity multiplier from what the user actually logged this week,
// instead of asking them to self-report an activity level we'd have no way to verify.
function activityMultiplierFromHistory(){
  const avgMin = Array.from({length:7}).map((_,i)=>dayAt(isoDaysAgo(i)).exercises.reduce((s,e)=>s+(Number(e.minutes)||0),0)).reduce((a,b)=>a+b,0)/7;
  if(avgMin < 15) return 1.2;
  if(avgMin < 30) return 1.375;
  if(avgMin < 60) return 1.55;
  return 1.725;
}
// Returns both the maintenance figure (TDEE) and a goal-adjusted recommendation, so it's
// visible *why* the two differ instead of showing one number that silently ignores the
// weight goal. Deficit/surplus are flat, standard, safety-floored amounts (~0.45 kg/week)
// rather than scaling with how far off the goal is — that's the commonly recommended safe
// pace regardless of total distance to the target.
function recommendedCalorieGoal(){
  const cfg = getForecastConfig();
  const latest = getLatestWeight();
  if(!cfg.heightCm || !cfg.birthDate || !latest) return null;
  const age = ageFromBirthDate(cfg.birthDate);
  const bmr = computeBMR(latest.weight, cfg.heightCm, age, cfg.gender);
  const tdee = bmr * activityMultiplierFromHistory();
  let adjustment = 0, direction = 'maintain';
  if(cfg.targetWeightKg != null){
    const deltaKg = cfg.targetWeightKg - latest.weight;
    if(deltaKg <= -1){ adjustment = -500; direction = 'lose'; }
    else if(deltaKg >= 1){ adjustment = 350; direction = 'gain'; }
  }
  const floor = bmr; // never recommend eating below resting metabolic rate, even with a deficit applied
  return { tdee: Math.round(tdee), goal: Math.round(Math.max(tdee + adjustment, floor)), direction };
}
function applyRecommendedCalorieGoal(){
  const rec = recommendedCalorieGoal();
  if(!rec) return;
  state.goals = { ...state.goals, calorieGoal: rec.goal };
  setGoals(state.goals);
  toast(tr('pron_meta_aplicada'));
  render();
}

const PATTERN_FOCUSES = {
  weight: { outcomeKey:'weight', labelKey:'pattern_focus_weight', outcomeLabelKey:'pattern_outcome_weight' },
  bp:     { outcomeKey:'sys',    labelKey:'pattern_focus_bp',     outcomeLabelKey:'pattern_outcome_bp' },
  sleep:  { outcomeKey:'sleep',  labelKey:'pattern_focus_sleep',  outcomeLabelKey:'pattern_outcome_sleep' },
};
const PATTERN_INPUTS = [
  { key:'protein', labelKey:'pattern_input_protein' },
  { key:'carbs', labelKey:'pattern_input_carbs' },
  { key:'fat', labelKey:'pattern_input_fat' },
  { key:'fiber', labelKey:'pattern_input_fiber' },
  { key:'sugar', labelKey:'pattern_input_sugar' },
  { key:'sodium', labelKey:'pattern_input_sodium' },
  { key:'exercise', labelKey:'pattern_input_exercise' },
  { key:'exerciseCal', labelKey:'pattern_input_exercisecal' },
  { key:'water', labelKey:'pattern_input_water' },
  { key:'medsAdherencePct', labelKey:'pattern_input_meds' },
  { key:'sleep', labelKey:'pattern_input_sleep' },
];
function getPatternsFocus(){ return LS.get('vl:patterns-focus') || 'weight'; }
function setPatternsFocus(f){ LS.set('vl:patterns-focus', f); render(); }
function togglePatternExpand(key){
  window._expandedPattern = window._expandedPattern===key ? null : key;
  render();

function computePatternData(days){
  days = days || 60;
  const dosesPerDay = state.meds.reduce((s,m)=>s+m.times.length,0);
  return Array.from({length:days}).map((_,i)=>{
    const iso = isoDaysAgo(days-1-i);
    const d = dayAt(iso);
    const lastBP = d.bp[d.bp.length-1];
    // A day with zero meals logged is almost always a day nobody bothered to log,
    // not a real zero-nutrient day — treating it as null (rather than the macroSums/
    // microSums default of 0) keeps unlogged days from masquerading as low-intake
    // data points and skewing the correlation. Exercise/water keep their real 0
    // default (a genuine rest day, or a day with no water logged, is a real value).
    const hasMeals = d.meals.length>0;
    const macros = hasMeals ? macroSums(d.meals) : null;
    const micros = hasMeals ? microSums(d.meals) : null;
    return {
      iso,
      weight: d.weight,
      sys: lastBP ? lastBP.systolic : null,
      sleep: d.sleepHours,
      protein: macros ? macros.protein : null,
      carbs: macros ? macros.carbs : null,
      fat: macros ? macros.fat : null,
      fiber: micros ? micros.fiber : null,
      sugar: micros ? micros.sugar : null,
      sodium: micros ? micros.sodium : null,
      exercise: d.exercises.reduce((s,e)=>s+(Number(e.minutes)||0),0),
      exerciseCal: d.exercises.reduce((s,e)=>s+(Number(e.calories)||0),0),
      exerciseTypeIds: new Set(d.exercises.map(e=>e.type).filter(Boolean)),
      water: d.water||0,
      // Unlike vitalityScore's same-day adherence (which excludes days with zero
      // logged doses to avoid a false "perfect score" on an empty day), here a
      // missed dose is exactly the data point this correlation needs to see — so
      // it's a real 0, not excluded, whenever the user has an active med at all.
      medsAdherencePct: dosesPerDay>0 ? clamp((d.medsTaken.length/dosesPerDay)*100, 0, 100) : null,
    };
  });
}
function rankedPatterns(focusKey, data){
  const focus = PATTERN_FOCUSES[focusKey];
  const ys = data.map(d=>d[focus.outcomeKey]);
  return PATTERN_INPUTS
    .filter(inp=>inp.key!==focus.outcomeKey)
    .map(inp=>{
      const res = pearsonR(data.map(d=>d[inp.key]), ys);
      return res ? { ...inp, r:res.r, n:res.n } : null;
    })
    .filter(p=>p && Math.abs(p.r)>=PATTERN_MIN_R)
    .sort((a,b)=>Math.abs(b.r)-Math.abs(a.r))
    .slice(0,4);
}
function exerciseTypePatterns(focusKey, data){
  const focus = PATTERN_FOCUSES[focusKey];
  const results = EXERCISE_TYPES.map(et=>{
    const withType = data.filter(d=>d.exerciseTypeIds.has(et.id) && d[focus.outcomeKey]!=null);
    const withoutType = data.filter(d=>!d.exerciseTypeIds.has(et.id) && d[focus.outcomeKey]!=null);
    if(withType.length<5 || withoutType.length<5) return null;
    const avg = arr=>arr.reduce((s,d)=>s+d[focus.outcomeKey],0)/arr.length;
    const avgWith = avg(withType), avgWithout = avg(withoutType);
    // Same "moderate effect" bar as PATTERN_MIN_R (Cohen's d), so a type split can't
    // surface on sample-size alone — a 0.1kg gap on noisy data no longer reads as fact.
    const all = [...withType, ...withoutType].map(d=>d[focus.outcomeKey]);
    const mean = all.reduce((s,v)=>s+v,0)/all.length;
    const sd = Math.sqrt(all.reduce((s,v)=>s+(v-mean)**2,0)/all.length);
    if(sd===0 || Math.abs(avgWith-avgWithout)/sd < 0.5) return null;
    return { id:et.id, avgWith, avgWithout, nWith:withType.length };
  }).filter(Boolean);
  return results.length>=2 ? results : [];
}

function nutricionChartData(){
  const n = state.nutritionRange;
  const maWindow = 30;
  const lookbackDays = n - 1 + maWindow; // extra days behind the visible range so the oldest point still gets a full 30-day trailing average
  const rawByDaysAgo = Array.from({length:lookbackDays}).map((_,daysAgo)=>{
    const d = dayAt(isoDaysAgo(daysAgo));
    return { ...macroSums(d.meals), ...microSums(d.meals) };
  });
  // The MA is always a 30-day average regardless of range, so on the 7-day view
  // it's a near-flat line well above/below that week's real data — suppress it
  // there entirely, same as Progreso's chart range toggle.
  function ma30(key){
    if(n===7) return null;
    return Array.from({length:n}).map((_,i)=>{
      const daysAgo = n-1-i;
      let sum = 0;
      for(let k=daysAgo; k<daysAgo+maWindow; k++) sum += rawByDaysAgo[k][key];
      return sum/maWindow;
    });
  }
  const isos = Array.from({length:n}).map((_,i)=>isoDaysAgo(n-1-i));
  // A single-letter-per-day label works at 7 points but overlaps illegibly at
  // 14-30 — thin to every 2nd/5th point instead of labeling every single one.
  const labelStep = n<=7 ? 1 : n<=14 ? 2 : 5;
  const axisLabel = (iso,i) => i%labelStep===0 ? dayLetter(iso) : '';
  const macroPts = isos.map((iso,i)=>{
    const r = rawByDaysAgo[n-1-i];
    return { label:axisLabel(iso,i), protein:r.protein, carbs:r.carbs, fat:r.fat };
  });
  const macroMA = { protein: ma30('protein'), carbs: ma30('carbs'), fat: ma30('fat') };

  const microDefs = [
    { key:'fiber', label:tr('micro_fibra')+' (g)', color:'var(--accent3)', unit:'g' },
    { key:'sugar', label:tr('micro_azucar')+' (g)', color:'var(--accent2)', unit:'g' },
    { key:'sodium', label:tr('micro_sodio')+' (mg)', color:'var(--danger)', unit:'mg' },
    { key:'iron', label:tr('micro_hierro')+' (mg)', color:'var(--accent)', unit:'mg' },
    { key:'calcium', label:tr('micro_calcio')+' (mg)', color:'var(--accent3)', unit:'mg' },
    { key:'potassium', label:tr('micro_potasio')+' (mg)', color:'var(--accent2)', unit:'mg' },
    { key:'vitaminC', label:tr('micro_vitc')+' (mg)', color:'var(--accent)', unit:'mg' },
  ];
  const microData = {};
  microDefs.forEach(mk=>{
    microData[mk.key] = {
      pts: isos.map((iso,i)=>({ label:axisLabel(iso,i), v: rawByDaysAgo[n-1-i][mk.key] })),
      ma: ma30(mk.key), color: mk.color, unit: mk.unit, label: mk.label,
    };
  });
  return { macroPts, macroMA, microDefs, microData };
}
function renderNutricion(){
  const { macroPts, macroMA, microDefs, microData } = nutricionChartData();
  const exp = window._expandedNutriChart;
  // Split rather than overlaying all 3 macros (+ their MA lines) on one chart —
  // protein and carbs in particular sit in overlapping ranges and cross
  // constantly, making a single 6-line chart hard to read. One metric per
  // chart matches the pattern already used for micronutrients below.
  const macroDefs = [
    { key:'protein', label: tr('macro_proteina')+' (g)', color:'var(--macro-protein)' },
    { key:'carbs', label: tr('macro_carbohidratos')+' (g)', color:'var(--macro-carbs)' },
    { key:'fat', label: tr('macro_grasas')+' (g)', color:'var(--macro-fat)' },
  ];
  const macroCharts = macroDefs.map(mk=>{
    const pts = macroPts.map(p=>({ label:p.label, v:p[mk.key] }));
    const isExp = exp===mk.key;
    return `<div class="card expand-card ${isExp?'expanded':''}" onclick="toggleChartExpand('nutri','${mk.key}')"><div class="label">${mk.label}</div><div class="chart-box">${lineChartSVG(pts,{color:mk.color, gridLines:true, gridSteps:isExp?5:4, unit:'g', maValues:macroMA[mk.key], h:isExp?320:150})}</div></div>`;
  }).join('');
  const microCharts = microDefs.map(mk=>{
    const d = microData[mk.key];
    const isExp = exp===mk.key;
    return `<div class="card expand-card ${isExp?'expanded':''}" onclick="toggleChartExpand('nutri','${mk.key}')"><div class="label">${d.label}</div><div class="chart-box">${lineChartSVG(d.pts,{color:d.color, gridLines:true, gridSteps:isExp?5:4, unit:d.unit, maValues:d.ma, h:isExp?320:150})}</div></div>`;
  }).join('');

  return `
  <div class="stack">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${[7,14,30].map(r=>`<button class="btn ${state.nutritionRange===r?'btn-primary':'btn-ghost'}" onclick="setNutritionRange(${r})">${r} ${tr('prog_dias')}</button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--muted);">${trf('nutr_ultimos_30_dias',{n:state.nutritionRange})} · ${tr('nutr_ma30_nota')}</div>
    <div class="grid2">
      ${macroCharts}
      ${microCharts}
    </div>
  </div>`;
}
function toggleChartExpand(scope, key){
  const prop = scope==='nutri' ? '_expandedNutriChart' : scope==='comp' ? '_expandedCompChart' : '_expandedProgresoChart';
  window[prop] = window[prop]===key ? null : key;

}

  const recCalories = recommendedCalorieGoal();
  const calorieRecCard = recCalories ? `

    ${recCalories.direction!=='maintain' ? `<div style="font-size:11px;color:var(--muted);margin-bottom:10px;">${tr('pron_mantenimiento')}: ${recCalories.tdee} ${tr('pron_kcal_dia')}</div>` : ''}

    <button class="btn btn-ghost" style="width:100%;" onclick="applyRecommendedCalorieGoal()">${tr('pron_usar_meta')}</button>
  </div>` : '';

  let resultCard = '';
  switch(forecast.status){
    case 'missing-config':
      resultCard = `<div class="card">${emptyState('pronostico', tr('pron_ingresa_datos'))}</div>`;
      break;
    case 'no-weight':

      break;
    case 'at-goal':
      resultCard = `<div class="card">${emptyState('logrado', trf('pron_en_meta_msg',{w:forecast.latest.weight}))}</div>`;
      break;
    case 'insufficient-data':
      resultCard = `<div class="card">
        <div class="label">${tr('nav_pronostico')}</div>
        <div style="color:var(--muted);font-size:13px;line-height:1.6;">
          ${tr('pron_insuficientes')}<br><br>
          ${tr('pron_desbloquear')}
        </div>
      </div>`;
      break;
    case 'wrong-direction':
      resultCard = `<div class="card">
        <div class="label">${tr('nav_pronostico')}</div>
        <div style="color:var(--danger);font-size:13px;margin-bottom:10px;">
          ${tr('pron_segun')} ${methodLabel}${tr('pron_moviendo_contrario')}${forecast.remainingKg>0?tr('pron_necesita_bajar'):tr('pron_necesita_subir')} ${Math.abs(forecast.remainingKg).toFixed(1)} kg${tr('pron_pero_ritmo')} ${weeklyRate>0?'+':''}${weeklyRate.toFixed(2)} ${tr('pron_kg_semana')}${tr('pron_cierre_parentesis')}

          ${statTile(navIcon('imc',14),tr('pron_imc_actual'), forecast.currentBMI.toFixed(1))}
        </div>
      </div>`;
      break;
    case 'ok': {
      const weeks = forecast.daysNeeded/7;
      resultCard = `<div class="card">
        <div class="label">${tr('nav_pronostico')}</div>
        <div class="grid4" style="margin-bottom:16px;">

          ${statTile(navIcon('meta',14),tr('pron_meta_label'), forecast.cfg.targetWeightKg+' kg')}
          ${statTile(navIcon('imc',14),tr('pron_imc_actual'), forecast.currentBMI.toFixed(1))}

          <div class="display" style="font-size:15px;color:var(--muted);margin-bottom:4px;">${tr('pron_tiempo_estimado')}</div>
          <div class="display" style="font-size:32px;font-weight:700;color:var(--accent);">${weeks<1?Math.round(forecast.daysNeeded)+' '+tr('prog_dias'):weeks.toFixed(1)+' '+tr('pron_semanas')}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px;">${tr('pron_fecha_estimada')} ${forecast.etaDate.toLocaleDateString(state.lang==='en'?'en-US':'es-ES',{day:'numeric',month:'long',year:'numeric'})}</div>

      </div>`;
      break;
    }
  }

  const weightHist = getWeightHistory(30);
  const chartCard = weightHist.length ? `<div class="card">
    <div class="label">${tr('pron_peso_vs_meta')}</div>
    <div class="chart-box">${lineChartSVG(
      Array.from({length:30}).map((_,i)=>{ const iso=isoDaysAgo(29-i); return { label:dayLetter(iso), v: dayAt(iso).weight }; }),
      {color:'var(--accent3)', gridLines:true, gridSteps:4, unit:'kg', targetValue: cfg.targetWeightKg||null}
    )}</div>
  </div>` : '';

  return `<div class="stack">${configCard}${calorieRecCard}${resultCard}${chartCard}</div>`;

function animateCountUp(el, target, duration){
  if(!el) return;
  const startTime = performance.now();
  function step(now){
    const t = Math.min(1, (now-startTime)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = Math.round(target*eased);
    if(t < 1) requestAnimationFrame(step); else el.textContent = target;
  }
  requestAnimationFrame(step);
}
function runHoyEntranceAnimation(){
  const ringEls = document.querySelectorAll('.ring-fill-animate');
  const targets = window._hoyAnimateTargets;
  window._hoyAnimateTargets = null;
  if(!ringEls.length && !targets) return;
  // Two rAFs so the browser has actually painted the "empty" starting state before we
  // change to the target — changing both in the same tick gives the CSS transition
  // nothing to animate from.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    ringEls.forEach(el=>{ el.style.strokeDashoffset = el.dataset.targetOffset; });
  }));
  if(targets){
    if(targets.vitality!=null) animateCountUp(document.getElementById('vitality-num'), targets.vitality, 900);
    if(targets.calories!=null) animateCountUp(document.getElementById('dial-cal-num'), targets.calories, 900);
  }
}

// Used only where a user is logging a meal they'll eat (Comidas / Calendario day),
// never inside the personalized-meal builder itself — personal meals are made of

function mealOrPersonalSuggestions(query){
  const personal = getPersonalMeals().map(pm=>({ label:pm.name, ts:pm.updatedAt||pm.createdAt, isPersonal:true }));
  const cache = Object.values(getNutritionCache());
  const all = personal.concat(cache).sort((a,b)=>b.ts-a.ts);
  const q = normalizeFoodKey(query);
  const filtered = q ? all.filter(e=>normalizeFoodKey(e.label).includes(q)) : all;

  }
  const cache = getNutritionCache();

  if(hit){

    document.getElementById('meal-p').value = hit.protein;

function bpCategory(sys, dia){
  if(sys>180 || dia>120) return { label:'Crisis hipertensiva', color:'var(--danger)' };
  if(sys>=140 || dia>=90) return { label:'Hipertensión etapa 2', color:'var(--danger)' };
  if(sys>=130 || dia>=80) return { label:'Hipertensión etapa 1', color:'var(--status-warn)' };
  if(sys>=120 && dia<80) return { label:'Elevada', color:'var(--status-warn)' };
  return { label:'Normal', color:'var(--status-good)' };
}

  if(!med) return;
  // Keep the same id — changing name/dose/times in place preserves any medsTaken
  // entries logged under time slots that still exist, instead of orphaning the
  // whole history the way delete-then-recreate does (id:time is the taken-key).
  med.name = name; med.dose = dose; med.times = times;
  setMeds(state.meds); syncNativeMedAlerts();
  window._medEditingId = null; render();
}
function toggleMedTaken(key){
  const exists = state.day.medsTaken.find(t=>t.key===key);
  if(exists) state.day.medsTaken = state.day.medsTaken.filter(t=>t.key!==key);
  else state.day.medsTaken.push({ key, time: nowHM() });
  saveDay(); render();
}

function toggleAlerts(){
  state.alertsOn = !state.alertsOn;
  if(state.alertsOn && 'Notification' in window && Notification.permission!=='granted'){
    Notification.requestPermission();
  }
  syncNativeMedAlerts();
  render();
}
// Android's WebView has no Web Notification API at all (confirmed: 'Notification' in
// window is false there), so the branch above never fires on the native app — medication
// alerts need real OS-level scheduled notifications instead, via the LocalNotifications
// Capacitor plugin (auto-registered on window.Capacitor.Plugins, no bundler/import needed).
// The web build keeps using the JS interval + Notification API above, untouched.
function medNotifId(medId, time){
  const s = medId+':'+time;
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))|0; }
  return Math.abs(h) % 2147483647 || 1;
}
async function syncNativeMedAlerts(){
  if(!(window.Capacitor && window.Capacitor.isNativePlatform())) return;
  const LN = window.Capacitor.Plugins.LocalNotifications;
  if(!LN) return;
  try{
    const pending = await LN.getPending();
    if(pending.notifications && pending.notifications.length){
      await LN.cancel({ notifications: pending.notifications.map(n=>({id:n.id})) });
    }
  }catch(e){}
  if(!state.alertsOn) return;
  try{
    let perm = await LN.checkPermissions();
    if(perm.display!=='granted') perm = await LN.requestPermissions();
    if(perm.display!=='granted') return;
    const notifications = [];
    state.meds.forEach(med=>{
      med.times.forEach(t=>{
        const [hour,minute] = t.split(':').map(Number);
        if(Number.isNaN(hour) || Number.isNaN(minute)) return;
        notifications.push({
          id: medNotifId(med.id, t),
          title: 'VitaLinks — Medicamento',
          body: `Es hora de tomar ${med.name}${med.dose?' ('+med.dose+')':''}`,
          schedule: { on:{ hour, minute }, allowWhileIdle:true },
        });
      });
    });
    if(notifications.length) await LN.schedule({ notifications });
  }catch(e){ console.error('local notif schedule error', e); }
}
setInterval(()=>{
  if(!state.alertsOn) return;
  const hm = nowHM();
  const takenIds = new Set(state.day.medsTaken.map(t=>t.key));
  state.meds.forEach(med=>{
    med.times.forEach(t=>{
      const key = med.id+':'+t;
      if(t===hm && !takenIds.has(key)){
        if('Notification' in window && Notification.permission==='granted'){
          new Notification('VitaLinks — Medicamento', { body: `Es hora de tomar ${med.name}${med.dose?' ('+med.dose+')':''}` });
        }
        try{ new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAAAAAAAAAAA=').play().catch(()=>{}); }catch(e){}
      }
    });
  });
}, 20000);

async function handleEstimateForDay(){
  const name = document.getElementById('cal-meal-name').value.trim();
  if(!name) return;
  const pm = findPersonalMealByName(name);
  if(pm){
    document.getElementById('cal-meal-cal').value = pm.totals.calories;
    document.getElementById('cal-meal-p').value = pm.totals.protein;
    document.getElementById('cal-meal-c').value = pm.totals.carbs;
    document.getElementById('cal-meal-f').value = pm.totals.fat;
    window._pendingMicros = { key: normalizeFoodKey(name), data: pm.totals };
    document.getElementById('cal-meal-note').textContent = '✓ ' + tr('pm_badge_reconocida');
    return;
  }
  const cache = getNutritionCache();
  const hit = cache[normalizeFoodKey(name)];
  if(hit){
    document.getElementById('cal-meal-cal').value = hit.calories;
    document.getElementById('cal-meal-p').value = hit.protein;
    document.getElementById('cal-meal-c').value = hit.carbs;
    document.getElementById('cal-meal-f').value = hit.fat;
    window._pendingMicros = { key: normalizeFoodKey(name), data: hit };
    document.getElementById('cal-meal-note').textContent = '✓ Desde tu historial (sin usar API)' + (hit.note?' — '+hit.note:'');
    return;
  }
  const btn = document.getElementById('cal-est-btn');
  btn.disabled = true; btn.textContent = 'Calculando…';
  window._estimateBusy = true;
  try{
    const shared = await lookupSharedFoodSafe(normalizeFoodKey(name));
    if(shared){
      document.getElementById('cal-meal-cal').value = shared.calories;
      document.getElementById('cal-meal-p').value = shared.protein ?? 0;
      document.getElementById('cal-meal-c').value = shared.carbs ?? 0;
      document.getElementById('cal-meal-f').value = shared.fat ?? 0;
      window._pendingMicros = { key: normalizeFoodKey(name), data: shared };
      document.getElementById('cal-meal-note').textContent = '✓ ' + (shared.note||'') + ' — desde el banco compartido';
      rememberNutrition(name, shared);
      return;
    }
    const r = await estimateNutrition(name);
    document.getElementById('cal-meal-cal').value = r.calories;
    document.getElementById('cal-meal-p').value = r.protein ?? 0;
    document.getElementById('cal-meal-c').value = r.carbs ?? 0;
    document.getElementById('cal-meal-f').value = r.fat ?? 0;
    window._pendingMicros = { key: normalizeFoodKey(name), data: r };
    document.getElementById('cal-meal-note').textContent = '✓ ' + (r.note||'') + ' — ajusta si no coincide';
    rememberNutrition(name, r);
    contributeSharedFoodSafe(normalizeFoodKey(name), name, r);
  }catch(e){
    toast(e.message || 'No se pudo estimar', true);
  }finally{
    btn.disabled=false; btn.innerHTML=navIcon('sparkle',14)+'Estimar';
    window._estimateBusy = false;
  }
}
function addMealForDay(iso){

function exportBackup(){
  const all = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('vl:')) all[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(all,null,2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `vitalinks-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(tr('export_backup_done'));
}

}
function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ toast(tr('err_import_invalid_json'), true); return; }
    const keys = Object.keys(data).filter(k=>k.startsWith('vl:'));
    if(!keys.length){ toast(tr('err_import_no_data'), true); return; }
    keys.forEach(k=>localStorage.setItem(k, data[k]));
    toast(trf('import_success', {count:keys.length}));
    setTimeout(()=>location.reload(), 1200);
  };
  reader.onerror = () => toast(tr('err_file_read'), true);
  reader.readAsText(file);
  input.value = '';
}

// Renders a branded square PNG card client-side, no backend involved. Uses the same
// approved logo asset as the PDF report and the app's own brand colors/fonts, so a
// shared card always reads as VitaLinks regardless of which achievement triggered it.
async function renderShareCard({ headline, headlineColor, subtitle }){
  try{
    await Promise.all([
      document.fonts.load("700 150px 'Space Grotesk'"),
      document.fonts.load("500 40px 'Inter'"),
      document.fonts.load("700 56px 'Space Grotesk'"),
    ]);
  }catch(e){}
  const S = 1080;
  const canvas = document.createElement('canvas');
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0E2723';
  ctx.fillRect(0,0,S,S);

  await new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img, S/2-80, 108, 160, 160); resolve(); };
    img.onerror = resolve;
    img.src = REPORT_LOGO_PNG;
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = headlineColor || '#EFF6F2';
  ctx.font = "700 150px 'Space Grotesk', sans-serif";
  ctx.fillText(headline, S/2, 560);

  ctx.fillStyle = '#8FB2A8';
  ctx.font = "500 40px 'Inter', sans-serif";
  ctx.fillText(subtitle, S/2, 630);

  ctx.font = "700 56px 'Space Grotesk', sans-serif";
  const vitaW = ctx.measureText('Vita').width;
  const linksW = ctx.measureText('Links').width;
  let x = S/2 - (vitaW+linksW)/2;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#EFF6F2';
  ctx.fillText('Vita', x, 920);
  x += vitaW;
  ctx.fillStyle = '#F2A65A';
  ctx.fillText('Links', x, 920);

  return new Promise(resolve=>canvas.toBlob(resolve, 'image/png'));
}
async function shareOrDownloadBlob(blob, filename, shareText){
  const file = new File([blob], filename, { type:'image/png' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:'VitaLinks', text: shareText }); return; }
    catch(e){ if(e.name==='AbortError') return; /* fall through to download */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  toast(tr('share_descargada'));
}
async function shareWeightProgress(){
  const firstEver = getFirstEverWeight();
  const latest = getLatestWeight();
  if(!firstEver || !latest || firstEver.iso===latest.iso){ toast(tr('share_sin_datos'), true); return; }
  const change = Math.round((latest.weight - firstEver.weight)*10)/10;
  const [fy,fm,fd] = firstEver.iso.split('-').map(Number);
  const [ly,lm,ld] = latest.iso.split('-').map(Number);
  const days = Math.max(1, Math.round((new Date(ly,lm-1,ld) - new Date(fy,fm-1,fd))/86400000));
  const headline = `${change>0?'+':''}${change} kg`;
  const headlineColor = change<0 ? '#7FC8B0' : (change>0 ? '#F2A65A' : '#EFF6F2');
  const blob = await renderShareCard({ headline, headlineColor, subtitle: trf('share_en_dias',{days}) });
  await shareOrDownloadBlob(blob, 'vitalinks-progreso.png', tr('share_texto'));
}

function getInviteCode(){
  let code = LS.get('vl:invite-code');
  if(!code){ code = uid()+uid(); LS.set('vl:invite-code', code); }
  return code;
}
function inviteURL(){
  return `${location.origin}${location.pathname}?ref=${getInviteCode()}`;
}
async function shareInvite(){
  const url = inviteURL();
  // The URL is embedded directly in the text, not left to the separate `url` field —
  // some share targets (several email apps in particular) only use `text` for the
  // message body and silently drop `url`, which would ship an invite with no link.
  // Both languages are included since the recipient's language isn't known.
  const text = `${I18N.es.invite_texto}\n${I18N.en.invite_texto}\n${url}`;
  // `title` becomes the email subject for share targets that route to a mail app —
  // a bare "VitaLinks" reads as spam-shaped to most filters. Bilingual for the same
  // reason as the body: the recipient's language isn't known ahead of time.
  const subject = `${I18N.es.invite_asunto} / ${I18N.en.invite_asunto}`;
  if(navigator.share){
    try{ await navigator.share({ title:subject, text, url }); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(url); toast(tr('invite_copiado')); return; }catch(e){}
  }
  try{ window.prompt(tr('invite_boton'), url); }catch(e){ toast(url, true); }
}
// Runs once at startup: if this looks like a fresh install opened via someone else's
// invite link, stage the code for the Firebase module script to record once it's
// loaded (it defines window.recordInviteConversion, but loads after this classic
// script — recordInviteConversion may not exist yet at this point), and strip the
// param from the URL either way.
function checkInviteParam(){
  const params = new URLSearchParams(location.search);
  const ref = params.get('ref');
  if(!ref) return;
  const isFreshInstall = !localStorage.getItem('vl:_lastChangeAt') && !localStorage.getItem('vl:invite-code');
  if(isFreshInstall) window._pendingInviteRef = ref;
  params.delete('ref');
  const qs = params.toString();
  history.replaceState(null, '', location.pathname + (qs?'?'+qs:''));
}

function shortDateReport(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(state.lang==='en' ? 'en-US' : 'es-ES', { day:'numeric', month:'short' });
}
function longDateReport(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(state.lang==='en' ? 'en-US' : 'es-ES', { day:'numeric', month:'short', year:'numeric' });
}
function round1(v){ return v==null ? null : Math.round(v*10)/10; }

function buildReportData(days){
  const isos = Array.from({length:days}).map((_,i)=>isoDaysAgo(days-1-i));
  const rows = isos.map(iso=>{
    const d = dayAt(iso);
    const calEaten = d.meals.reduce((s,m)=>s+(Number(m.calories)||0),0);
    const exMin = d.exercises.reduce((s,e)=>s+(Number(e.minutes)||0),0);
    const exCal = d.exercises.reduce((s,e)=>s+(Number(e.calories)||0),0);
    return { iso, weight:d.weight, calEaten, exMin, exCal, water:d.water||0, sleepHours:d.sleepHours,
      bp:d.bp||[], meals:d.meals||[], medsTaken:d.medsTaken||[], bodyComp:d.bodyComp||[] };
  });

  const g = state.goals;
  const cfg = getForecastConfig();

  const firstEver = getFirstEverWeight();
  const latestW = getLatestWeight();
  const weightChange = (firstEver && latestW) ? round1(latestW.weight - firstEver.weight) : null;
  const bmi = (latestW && cfg.heightCm) ? round1(latestW.weight/Math.pow(cfg.heightCm/100,2)) : null;

  const calDays = rows.filter(r=>r.calEaten>0);
  const avgCal = calDays.length ? Math.round(calDays.reduce((s,r)=>s+r.calEaten,0)/calDays.length) : null;

  const allMeals = rows.flatMap(r=>r.meals);
  const mealDayCount = calDays.length || 1;
  const macroTotals = macroSums(allMeals);
  const microTotals = microSums(allMeals);
  const avgMacros = { protein:round1(macroTotals.protein/mealDayCount), carbs:round1(macroTotals.carbs/mealDayCount), fat:round1(macroTotals.fat/mealDayCount) };
  const avgMicros = Object.fromEntries(Object.entries(microTotals).map(([k,v])=>[k, round1(v/mealDayCount)]));

  const totalExMin = rows.reduce((s,r)=>s+r.exMin,0);
  const totalExCal = rows.reduce((s,r)=>s+r.exCal,0);
  const avgExPerWeek = Math.round(totalExMin/(days/7));
  const exGoalDays = rows.filter(r=>r.exMin >= g.exerciseGoal).length;

  const sleepVals = rows.map(r=>r.sleepHours).filter(v=>v!=null);
  const avgSleep = sleepVals.length ? round1(sleepVals.reduce((a,b)=>a+b,0)/sleepVals.length) : null;

  const bpReadings = rows.flatMap(r=>r.bp.map(b=>({...b, iso:r.iso})));
  const avgSys = bpReadings.length ? Math.round(bpReadings.reduce((s,b)=>s+b.systolic,0)/bpReadings.length) : null;
  const avgDia = bpReadings.length ? Math.round(bpReadings.reduce((s,b)=>s+b.diastolic,0)/bpReadings.length) : null;
  const pulseVals = bpReadings.map(b=>b.pulse).filter(v=>v!=null);
  const avgPulse = pulseVals.length ? Math.round(pulseVals.reduce((a,b)=>a+b,0)/pulseVals.length) : null;
  const catCounts = {};
  bpReadings.forEach(b=>{ const c = bpCategory(b.systolic,b.diastolic).label; catCounts[c] = (catCounts[c]||0)+1; });

  const bcEntries = rows.flatMap(r=>r.bodyComp.map(bc=>({...bc, iso:r.iso}))).sort((a,b)=>a.iso===b.iso?0:(a.iso<b.iso?-1:1));
  const latestBC = {};
  BODYCOMP_FIELDS.forEach(f=>{
    for(let i=rows.length-1;i>=0;i--){
      const v = latestBodyCompValue(rows[i], f.key);
      if(v!=null){ latestBC[f.key] = v; break; }
    }
  });

  const adherence = state.meds.length>0 ? medAdherence(days) : null;

  return {
    days, isos, rows,
    weight: { first:firstEver, latest:latestW, change:weightChange, bmi, daily: rows.map(r=>({iso:r.iso, v:r.weight})) },
    calories: { avg:avgCal, goal:g.calorieGoal, daysLogged:calDays.length, daily: rows.map(r=>({iso:r.iso, v:r.calEaten||null})) },
    macros: avgMacros, micros: avgMicros,
    exercise: { totalMin:totalExMin, avgPerWeek:avgExPerWeek, totalCal:totalExCal, goal:g.exerciseGoal, goalDays:exGoalDays },
    sleep: { avg:avgSleep, daily: rows.map(r=>({iso:r.iso, v:r.sleepHours})) },
    bp: { readings:bpReadings, avgSys, avgDia, avgPulse, catCounts,
      daily: rows.map(r=>{ const last=r.bp[r.bp.length-1]; return { iso:r.iso, sys: last?last.systolic:null, dia: last?last.diastolic:null }; }) },
    bodyComp: { latest:latestBC, entries:bcEntries },
    meds: { list:state.meds, adherence },
    goals: g, forecastConfig: cfg,
  };
}

function reportFlags(data){
  const flags = [];
  if(data.bp.readings.length){
    const worst = Object.entries(data.bp.catCounts).sort((a,b)=>b[1]-a[1])[0];
    if(worst && worst[0]!=='Normal') flags.push(trf('report_flag_pa', { cat:worst[0], n:worst[1], total:data.bp.readings.length }));
  }
  if(data.meds.adherence!=null && data.meds.adherence<80) flags.push(trf('report_flag_adherencia', { pct:data.meds.adherence }));
  const bf = data.bodyComp.latest.bodyFatPct;
  if(bf!=null && (bf<8 || bf>32)) flags.push(trf('report_flag_grasa', { val:bf }));
  const vf = data.bodyComp.latest.visceralFat;
  if(vf!=null && vf>=15) flags.push(trf('report_flag_visceral', { val:vf }));
  return flags;
}

function pdfSectionTitle(doc, text, x, y, w){
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(20,50,45);
  doc.text(text, x, y);
  doc.setDrawColor(242,166,90); doc.setLineWidth(1.4);
  doc.line(x, y+6, x+w, y+6);
  doc.setDrawColor(210,215,212);
}
function pdfKpiRow(doc, x, y, w, items){
  const colW = w/items.length;
  items.forEach((it,i)=>{
    const cx = x + colW*i;
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120,130,126);
    doc.text(it.label, cx, y);
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(20,50,45);
    doc.text(String(it.value), cx, y+18);
    if(it.sub){ doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,150,145); doc.text(it.sub, cx, y+30); }
  });
  return y+42;
}
function pdfLineChart(doc, x, y, w, h, seriesList, opts){
  opts = opts || {};
  const allVals = seriesList.flatMap(s=>s.values.map(p=>p.v)).filter(v=>v!=null);
  doc.setDrawColor(225,229,226); doc.setLineWidth(0.5);
  doc.rect(x, y, w, h);
  if(!allVals.length){
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(150,160,155);
    doc.text(tr('chart_no_data'), x+w/2, y+h/2, { align:'center' });
    return;
  }
  const yMin = opts.yMin!=null ? opts.yMin : Math.min(...allVals)*0.95;
  const yMax = opts.yMax!=null ? opts.yMax : Math.max(...allVals)*1.05;
  const gridN = 4;
  doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(140,150,145);
  for(let i=0;i<=gridN;i++){
    const gy = y + h - (h*i/gridN);
    doc.setDrawColor(235,238,236); doc.setLineWidth(0.4);
    doc.line(x, gy, x+w, gy);
    const val = yMin + (yMax-yMin)*i/gridN;
    doc.text(val.toFixed(0), x-5, gy+2, { align:'right' });
  }
  seriesList.forEach(s=>{
    const n = s.values.length;
    doc.setDrawColor(s.color[0], s.color[1], s.color[2]); doc.setLineWidth(1.4);
    let prev = null;
    s.values.forEach((p,idx)=>{
      if(p.v==null){ prev=null; return; }
      const px = x + w*idx/(n-1);
      const py = y + h - h*(p.v-yMin)/(yMax-yMin);
      if(prev) doc.line(prev.x, prev.y, px, py);
      prev = { x:px, y:py };
    });
  });
  const n = seriesList[0].values.length;
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(120,130,126);
  [0, Math.floor((n-1)/2), n-1].forEach(idx=>{
    const iso = seriesList[0].values[idx].iso;
    const lx = x + w*idx/(n-1);
    const align = idx===0 ? 'left' : (idx===n-1 ? 'right' : 'center');
    doc.text(shortDateReport(iso), lx, y+h+11, { align });
  });
}
function pdfLegend(doc, x, y, items){
  let cx = x;
  items.forEach(it=>{
    doc.setFillColor(it.color[0], it.color[1], it.color[2]);
    doc.circle(cx+3, y-3, 3, 'F');
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,100,96);
    doc.text(it.label, cx+10, y);
    cx += 12 + doc.getTextWidth(it.label) + 16;
  });
}
function buildHealthReportDoc(days){
  days = days || 30;
  if(!window.jspdf || !window.jspdf.jsPDF) return null;
  const data = buildReportData(days);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const PW = 595.28, PH = 841.89, MX = 48, CW = PW - MX*2;
  const ORANGE=[242,166,90], TEAL=[127,200,176], YELLOW=[232,196,104], DARK=[20,50,45], MUTED=[120,130,126];
  const tableTheme = { theme:'grid', margin:{left:MX,right:MX}, styles:{fontSize:8.5, textColor:[40,50,47], lineColor:[225,229,226], lineWidth:0.5},
    headStyles:{ fillColor:[27,69,63], textColor:255, fontStyle:'bold' }, alternateRowStyles:{ fillColor:[246,248,247] } };

  // ---- Cover page ----
  doc.setFillColor(14,39,35); doc.rect(0,0,PW,PH,'F');
  doc.addImage(REPORT_LOGO_PNG, 'PNG', PW/2-55, 130, 110, 110);
  doc.setFont('helvetica','bold'); doc.setFontSize(28); doc.setTextColor(239,246,242);
  doc.text('VitaLinks', PW/2, 280, { align:'center' });
  doc.setFont('helvetica','normal'); doc.setFontSize(17); doc.setTextColor(...ORANGE);
  doc.text(tr('report_titulo'), PW/2, 308, { align:'center' });
  doc.setFontSize(11); doc.setTextColor(...TEAL);
  doc.text(trf('report_subtitulo', { days }), PW/2, 328, { align:'center' });

  const startIso = data.isos[0], endIso = data.isos[data.isos.length-1];
  doc.setFontSize(10.5); doc.setTextColor(210,225,220);
  const coverLines = [
    `${tr('report_periodo')}: ${longDateReport(startIso)} — ${longDateReport(endIso)}`,
    `${tr('report_paciente')}: Widy Medina`,
    `${tr('report_generado')} ${longDateReport(todayISO())}`,
  ];
  coverLines.forEach((line,i)=>doc.text(line, PW/2, 400+i*20, { align:'center' }));

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(143,178,168);
  const confLines = doc.splitTextToSize(tr('report_confidencial'), 380);
  doc.text(confLines, PW/2, PH-90, { align:'center' });

  // ---- Executive summary ----
  doc.addPage();
  let y = 56;
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(...DARK);
  doc.text(tr('report_resumen'), MX, y); y += 26;

  const kpis1 = [
    { label: tr('report_peso_inicial'), value: data.weight.first ? `${data.weight.first.weight} kg` : '—' },
    { label: tr('report_peso_actual'), value: data.weight.latest ? `${data.weight.latest.weight} kg` : '—' },
    { label: tr('report_cambio'), value: data.weight.change!=null ? `${data.weight.change>0?'+':''}${data.weight.change} kg` : '—' },
    { label: tr('report_imc_actual'), value: data.weight.bmi!=null ? data.weight.bmi : '—' },
  ];
  y = pdfKpiRow(doc, MX, y+6, CW, kpis1) + 16;

  const kpis2 = [
    { label: tr('report_cal_prom_dia'), value: data.calories.avg!=null?`${data.calories.avg}`:'—', sub: `${tr('hoy_de')} ${data.calories.goal} kcal` },
    { label: tr('report_pa_prom'), value: (data.bp.avgSys!=null?`${data.bp.avgSys}/${data.bp.avgDia}`:'—') },
    { label: tr('report_pulso_prom'), value: data.bp.avgPulse!=null?`${data.bp.avgPulse} bpm`:'—' },
    { label: tr('report_sueno_prom'), value: data.sleep.avg!=null?`${data.sleep.avg} h`:'—' },
  ];
  y = pdfKpiRow(doc, MX, y+6, CW, kpis2) + 16;

  const kpis3 = [
    { label: tr('report_ejercicio_total'), value: `${data.exercise.totalMin} min`, sub: `${tr('report_prom_semanal')}: ${data.exercise.avgPerWeek} min` },
    { label: tr('report_adherencia_meds'), value: data.meds.adherence!=null?`${data.meds.adherence}%`:'—' },
  ];
  y = pdfKpiRow(doc, MX, y+6, CW/2, kpis3) + 20;

  doc.setDrawColor(225,229,226); doc.setLineWidth(0.7); doc.line(MX, y, MX+CW, y); y += 22;

  pdfSectionTitle(doc, tr('report_puntos_discutir'), MX, y, CW); y += 20;
  const flags = reportFlags(data);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(60,70,66);
  if(!flags.length){
    doc.text('• ' + tr('report_sin_puntos'), MX, y); y += 16;
  } else {
    flags.forEach(f=>{
      const lines = doc.splitTextToSize('• ' + f, CW);
      doc.text(lines, MX, y); y += lines.length*13 + 4;
    });
  }

  // ---- Weight & body composition ----
  doc.addPage(); y = 56;
  pdfSectionTitle(doc, tr('report_peso_composicion'), MX, y, CW); y += 26;
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...DARK);
  doc.text(tr('hoy_peso'), MX, y); y += 8;
  pdfLineChart(doc, MX, y, CW, 110, [{ color:TEAL, values:data.weight.daily }], {});

  // ---- Blood pressure ----
  doc.addPage(); y = 56;
  pdfSectionTitle(doc, tr('report_presion_arterial'), MX, y, CW); y += 26;
  if(data.bp.readings.length){
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...DARK);
    doc.text(`${tr('report_pa_prom')}: ${data.bp.avgSys}/${data.bp.avgDia} mmHg`, MX, y); y += 10;
    pdfLineChart(doc, MX, y, CW, 110, [
      { color:ORANGE, values:data.bp.daily.map(d=>({iso:d.iso, v:d.sys})) },
      { color:TEAL, values:data.bp.daily.map(d=>({iso:d.iso, v:d.dia})) },

    pdfLegend(doc, MX, y+128, [{ color:ORANGE, label:tr('salud_sistolica') }, { color:TEAL, label:tr('salud_diastolica') }]);
    y += 150;

    const catRows = Object.entries(data.bp.catCounts).map(([cat,n])=>[cat, String(n), `${Math.round(n/data.bp.readings.length*100)}%`]);
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...DARK);
    doc.text(tr('report_distribucion'), MX, y); y += 8;
    doc.autoTable(Object.assign({}, tableTheme, { startY:y, head:[[tr('report_col_categoria'), tr('report_col_dias'), '%']], body:catRows }));

    doc.text(tr('report_lecturas'), MX, y); y += 8;
    doc.autoTable(Object.assign({}, tableTheme, { startY:y, head:[[tr('report_col_fecha'), tr('report_col_hora'), 'mmHg', tr('salud_pulso'), tr('report_col_categoria')]], body:readRows }));
  } else {

    doc.text(tr('report_sin_lecturas_pa'), MX, y);
  }

  // ---- Nutrition ----
  doc.addPage(); y = 56;
  pdfSectionTitle(doc, tr('report_nutricion'), MX, y, CW); y += 26;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...MUTED);
  doc.text(`${tr('report_dias_con_registro')}: ${data.calories.daysLogged} ${trf('report_dias_registrados',{days})}`, MX, y); y += 16;

  const macroRows = [
    [tr('macro_proteina'), `${data.macros.protein} g`],
    [tr('macro_carbohidratos'), `${data.macros.carbs} g`],
    [tr('macro_grasas'), `${data.macros.fat} g`],
    [tr('report_cal_prom_dia'), data.calories.avg!=null?`${data.calories.avg} / ${data.calories.goal} kcal`:'—'],
  ];
  doc.autoTable(Object.assign({}, tableTheme, { startY:y, head:[[tr('macro_title'), tr('report_col_valor')]], body:macroRows, tableWidth:CW*0.48 }));
  const microRows = [
    [tr('micro_fibra'), `${data.micros.fiber} g`], [tr('micro_azucar'), `${data.micros.sugar} g`],
    [tr('micro_sodio'), `${data.micros.sodium} mg`], [tr('micro_hierro'), `${data.micros.iron} mg`],
    [tr('micro_calcio'), `${data.micros.calcium} mg`], [tr('micro_potasio'), `${data.micros.potassium} mg`],
    [tr('micro_vitc'), `${data.micros.vitaminC} mg`],
  ];
  doc.autoTable(Object.assign({}, tableTheme, { startY:y, head:[[tr('micro_title'), tr('report_col_valor')]], body:microRows, tableWidth:CW*0.48, margin:{left:MX+CW*0.52,right:MX} }));
  y = Math.max(doc.lastAutoTable.finalY, y) + 24;

  // ---- Exercise & sleep ----
  doc.addPage(); y = 56;
  pdfSectionTitle(doc, tr('report_ejercicio_sueno'), MX, y, CW); y += 26;
  const exKpis = [
    { label: tr('report_ejercicio_total'), value: `${data.exercise.totalMin} min` },
    { label: tr('report_prom_semanal'), value: `${data.exercise.avgPerWeek} min` },
    { label: tr('stat_quemadas'), value: `${data.exercise.totalCal} kcal` },
    { label: tr('report_dias_meta_cumplida'), value: `${data.exercise.goalDays}/${days}` },
  ];
  y = pdfKpiRow(doc, MX, y+6, CW, exKpis) + 20;
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...DARK);
  doc.text(tr('hoy_sueno'), MX, y); y += 8;
  pdfLineChart(doc, MX, y, CW, 100, [{ color:YELLOW, values:data.sleep.daily }], {});

  // ---- Medications ----
  doc.addPage(); y = 56;
  pdfSectionTitle(doc, tr('report_medicamentos'), MX, y, CW); y += 26;
  if(data.meds.list.length){
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...MUTED);
    doc.text(`${tr('report_adherencia_meds')}: ${data.meds.adherence}% (${days} ${tr('report_col_dias').toLowerCase()})`, MX, y); y += 14;
    const medRows = data.meds.list.map(m=>[m.name, m.dose||'—', (m.times||[]).join(', ')]);
    doc.autoTable(Object.assign({}, tableTheme, { startY:y, head:[[tr('salud_nombre'), tr('report_col_dosis'), tr('report_col_horario')]], body:medRows }));
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...MUTED);
    doc.text(tr('report_sin_medicamentos'), MX, y);
  }

  // ---- Daily log appendix ----
  doc.addPage(); y = 56;
  pdfSectionTitle(doc, tr('report_registro_diario'), MX, y, CW); y += 26;
  const dailyRows = data.rows.map(r=>{
    const lastBP = r.bp[r.bp.length-1];
    return [
      longDateReport(r.iso),
      r.weight!=null?r.weight:'—',
      r.calEaten||'—',
      r.exMin||'—',
      lastBP ? `${lastBP.systolic}/${lastBP.diastolic}` : '—',
      r.sleepHours!=null?r.sleepHours:'—',
      r.water||'—',
    ];
  });
  doc.autoTable(Object.assign({}, tableTheme, { startY:y,
    head:[[tr('report_col_fecha'), tr('report_col_peso'), tr('report_col_calorias'), tr('report_col_ejercicio'), tr('report_col_pa'), tr('report_col_sueno'), tr('report_col_agua')]],
    body:dailyRows, styles:Object.assign({}, tableTheme.styles, { fontSize:7.5 }) }));

  // ---- Footer on every page ----
  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1;p<=totalPages;p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(150,160,155);
    if(p>1){
      doc.text('VitaLinks', MX, PH-28);
      doc.text(`${tr('report_pagina')} ${p} ${tr('report_de_pagina')} ${totalPages}`, PW-MX, PH-28, { align:'right' });
    }
  }

  return doc;
}
function generateHealthReportPDF(days){

  const doc = buildHealthReportDoc(days);

/* ================= cross-tab sync ================= */
// Each tab keeps its own in-memory copy of today's data. Without this, opening
// the dashboard in more than one tab (e.g. clicking the desktop icon twice)
// lets whichever tab saves last silently overwrite entries made in the other.
function resyncFromStorage(){
  state.day = getDay(todayISO());
  state.goals = getGoals();
  state.meds = getMeds();
  render();
}
window.addEventListener('storage', (e)=>{ if(!e.key || e.key.startsWith('vl:')) resyncFromStorage(); });
window.addEventListener('focus', resyncFromStorage);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') resyncFromStorage(); });

/* ================= back/Escape handling ================= */
// Closes whatever overlay is topmost (scanner needs its own path to release the
// camera). Returns true if something was actually closed, so callers can tell
// "we handled this" from "there was nothing open."
function handleBackAction(){
  if(window._modal==='scanner'){ closeScanner(); return true; }
  if(window._modal){ closeModal(); return true; }
  if(window._pmView){ closePersonalMealBuilder(); return true; }
  return false;
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') handleBackAction(); });
if(window.Capacitor && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins.App){
  // Without this, Android's back button/gesture has nothing to fall back to (this
  // is a single-page app with no real navigation history) and exits the app
  // outright from inside Settings, the scanner, or the personal-meal builder --
  // closing the open overlay first, exactly like every native Android app does,
  // needs this explicit opt-in per Capacitor's own recommended pattern.
  window.Capacitor.Plugins.App.addListener('backButton', ({canGoBack}) => {
    if(handleBackAction()) return;
    if(canGoBack) window.history.back();
    else window.Capacitor.Plugins.App.exitApp();
  });
}

/* ================= init ================= */
checkInviteParam();
if(state.tab==='hoy') window._hoyAnimate = true;
render();
syncNativeMedAlerts();

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCredential, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCa-OtYw9PP02-f7maZ3WSKkYEkpRnHPIc",
    authDomain: "vitalink-widy.firebaseapp.com",
    projectId: "vitalink-widy",
    storageBucket: "vitalink-widy.firebasestorage.app",
    messagingSenderId: "830173192907",
    appId: "1:830173192907:web:dacc740b8909601b99f14e",
    measurementId: "G-8LZ4277YRB"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let unsubscribeSnapshot = null;
  let pushTimer = null;
  let lastPushedAt = 0;
  // Set true the first time we've actually seen the cloud's current state for
  // this sign-in (a real snapshot, or confirmation the doc doesn't exist yet).
  // Tracked separately from lastPushedAt because the failure mode this guards
  // against has nothing to do with echoing our own writes: a freshly-cleared
  // or reinstalled device signs in, some unrelated local write (even just a
  // theme toggle) fires _scheduleCloudPush, and — if that timer resolves
  // before the initial pull arrives — a near-empty local state races ahead
  // and overwrites real data the device just hasn't fetched yet. That's
  // exactly how a real multi-week data loss happened. Blocking every push
  // until the real remote state has been observed at least once closes the
  // race outright, and self-heals once it arrives (see applyRemoteSnapshot's
  // own conditional pushToCloud() call).
  let remoteSnapshotSeen = false;
  let lastKnownRemoteDayCount = 0;

  function safeRender(){ if(typeof window.render==='function') window.render(); }

  function dayKeyCount(obj){ return Object.keys(obj).filter(k=>k.startsWith('vl:day:')).length; }

  function collectLocalData(){
    const all = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k.startsWith('vl:') && k!=='vl:apikey' && k!=='vl:_lastChangeAt') all[k]=localStorage.getItem(k);
    }
    return all;
  }

  async function pushToCloud(){
    if(!currentUser) return;
    if(!remoteSnapshotSeen) return;
    const payload = collectLocalData();
    const localDays = dayKeyCount(payload);
    // Day logs are effectively append-only from this sync layer's point of view
    // (nothing in the UI deletes a whole day) — a push with fewer days than the
    // cloud already has is always suspicious, never a legitimate daily update.
    if(lastKnownRemoteDayCount > 0 && localDays < lastKnownRemoteDayCount){
      window._syncState.error = `Sync blocked: this device has ${localDays} day(s) logged but the cloud has ${lastKnownRemoteDayCount} — refusing to overwrite. Reload the app before making further changes.`;
      safeRender();
      return;
    }
    window._syncState.syncing = true; window._syncState.error = null; safeRender();
    const ts = Date.now();
    try{
      await setDoc(doc(db,'users',currentUser.uid), { data: payload, updatedAt: ts });
      lastPushedAt = ts;
      window._syncState.lastSyncAt = ts;
    }catch(e){
      window._syncState.error = e.message;
    }
    window._syncState.syncing = false; safeRender();
  }
  window._scheduleCloudPush = function(){
    if(!currentUser) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushToCloud, 2000);
  };

  // Shared, cross-user reference banks (foods/{normalizedName}, barcodeFoods/{barcode}).
  // Read is public; write only happens from a vetted source (AI estimate or Open Food
  // Facts), never from raw user text, and is create-only — Firestore rules reject
  // overwriting an existing doc, so the bank is append-only/immutable by construction.
  window.lookupSharedFood = async function(key){
    try{ const snap = await getDoc(doc(db,'foods',key)); return snap.exists() ? snap.data() : null; }
    catch(e){ return null; }
  };
  window.contributeSharedFood = async function(key, data){
    try{ await setDoc(doc(db,'foods',key), data); }catch(e){ /* likely already contributed by another user, or not signed in — both fine to ignore */ }
  };
  window.lookupSharedBarcode = async function(code){
    try{ const snap = await getDoc(doc(db,'barcodeFoods',code)); return snap.exists() ? snap.data() : null; }
    catch(e){ return null; }
  };
  window.contributeSharedBarcode = async function(code, data){
    try{ await setDoc(doc(db,'barcodeFoods',code), data); }catch(e){}
  };

  // Invite-conversion tracking: append-only, one doc per successful conversion, no
  // updates ever needed — same create-only shape as the foods/barcodeFoods banks
  // above. Requires a Firestore rule for `inviteUses` (public create, owner-only
  // read-by-code query) that doesn't exist yet; silently no-ops until it's added.
  window.recordInviteConversion = async function(code){
    try{ await setDoc(doc(db,'inviteUses',uidLike()), { code, ts:Date.now() }); }catch(e){}
  };
  function uidLike(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  if(window._pendingInviteRef){ window.recordInviteConversion(window._pendingInviteRef); window._pendingInviteRef = null; }

  function applyRemoteSnapshot(snap){
    if(!snap.exists()){ remoteSnapshotSeen = true; lastKnownRemoteDayCount = 0; pushToCloud(); return; }
    const remote = snap.data();
    const remoteData = remote.data || {};
    // Update before the echo check below so our own pushes keep this current too.
    remoteSnapshotSeen = true;
    lastKnownRemoteDayCount = dayKeyCount(remoteData);
    if(remote.updatedAt === lastPushedAt) return; // echo of our own push
    const remoteUpdatedAt = remote.updatedAt || 0;
    const localUpdatedAt = Number(localStorage.getItem('vl:_lastChangeAt')||0);
    if(remoteUpdatedAt > localUpdatedAt){
      Object.keys(remoteData).forEach(k=>localStorage.setItem(k, remoteData[k]));
      localStorage.setItem('vl:_lastChangeAt', String(remoteUpdatedAt));
      window._syncState.lastSyncAt = Date.now();
      if(typeof window.resyncFromStorage === 'function') window.resyncFromStorage();
      else safeRender();
    } else if(localUpdatedAt > remoteUpdatedAt){
      pushToCloud();
    }
  }

  window.firebaseSignIn = async function(){
    try{
      if(window.Capacitor && window.Capacitor.isNativePlatform()){
        // Firebase Auth's signInWithPopup needs a real browser window/tab, which the
        // app's embedded WebView doesn't provide — it opens and vanishes instantly
        // (auth/popup-closed-by-user). Native Google Sign-In (via the platform account
        // picker) gets a real credential instead, which we hand to the same JS SDK.
        const result = await window.Capacitor.Plugins.FirebaseAuthentication.signInWithGoogle();
        const idToken = result.credential && result.credential.idToken;
        if(!idToken) throw new Error('No ID token returned from native Google sign-in');
        const credential = GoogleAuthProvider.credential(idToken);
        await signInWithCredential(auth, credential);
      } else {
        await signInWithPopup(auth, provider);
      }
    }
    catch(e){ window._syncState.error = e.message; safeRender(); }
  };
  window.firebaseSignOut = async function(){
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
    if(window.Capacitor && window.Capacitor.isNativePlatform()){
      try{ await window.Capacitor.Plugins.FirebaseAuthentication.signOut(); }catch(e){}
    }
    await signOut(auth);
  };

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    window._syncState.user = user ? { email: user.email, uid: user.uid } : null;
    window._syncState.ready = true;
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
    // Reset per-session sync-safety state on every auth change (sign-in, sign-out,
    // or switching accounts without a full page reload) — each new subscription
    // must earn its own "we've seen the real cloud state" before it's allowed to push.
    remoteSnapshotSeen = false;
    lastKnownRemoteDayCount = 0;
    if(user){
      unsubscribeSnapshot = onSnapshot(doc(db,'users',user.uid), applyRemoteSnapshot, (err)=>{
        window._syncState.error = err.message; safeRender();
      });
    }
    safeRender();
  });
</script>
