<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VitaLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  :root{
    --bg:#0E2723; --surface:#153934; --raised:#1B453F; --line:#2A5049;
    --accent:#F2A65A; --accent2:#E8C468; --accent3:#7FC8B0;
    --text:#EFF6F2; --muted:#8FB2A8; --danger:#E07A5F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .display{font-family:'Space Grotesk',sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  a{color:inherit;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;background:var(--raised);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 10px;font-size:14px;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;}
  .label{font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .info-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;width:18px;height:18px;min-width:18px;font-size:11px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:normal;}
  .info-btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-ghost{background:var(--raised);color:var(--text);border:1px solid var(--line);}
  .btn-danger{background:var(--danger);color:var(--bg);}
  .btn:disabled{opacity:.5;cursor:default;}
  .row-item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:var(--raised);border-radius:12px;}
  .suggest-list{position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--raised);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:180px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .suggest-item{padding:8px 10px;font-size:14px;cursor:pointer;}
  .suggest-item:hover{background:var(--surface);}
  .pill{border-radius:12px;border:1px solid var(--line);background:var(--raised);padding:9px 4px;text-align:center;cursor:pointer;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;}
  .pill.active{border-color:var(--accent);background:rgba(242,166,90,.12);color:var(--accent);font-weight:700;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .stack{display:flex;flex-direction:column;gap:16px;}

  #app{display:flex;min-height:100vh;max-width:1180px;margin:0 auto;}
  nav.side{width:210px;flex-shrink:0;padding:24px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;}
  nav.side .brand{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;padding:0 12px 22px;}
  nav.side .brand .owner{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px;}
  nav.side .navbtn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:var(--muted);cursor:pointer;font-size:14px;margin-bottom:2px;}
  nav.side .navbtn.active{background:var(--raised);color:var(--accent);font-weight:700;}
  nav.side .navbtn .ic{font-size:16px;width:20px;text-align:center;}
  .ic-svg{width:19px;height:19px;flex-shrink:0;display:block;}
  .ic-svg path,.ic-svg circle,.ic-svg rect{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
  .ic-svg .fill{fill:currentColor;stroke:none;}
  nav.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;}
  main{flex:1;padding:28px 32px 60px;min-width:0;}
  main header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  main header h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0;}
  main header .sub{color:var(--muted);font-size:13px;text-transform:capitalize;}

  .toast{margin:0 0 16px;padding:12px 14px;background:rgba(224,122,95,.15);border:1px solid var(--danger);border-radius:10px;color:var(--danger);font-size:13px;}
  .toast.ok{background:rgba(127,200,176,.15);border-color:var(--accent3);color:var(--accent3);}

  .dial-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0;}
  .legend{display:flex;gap:16px;}
  .legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:99px;display:inline-block;}

  .meal-type-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-size:10px;color:var(--muted);}
  .meal-type-btn.active{border-color:var(--accent);background:rgba(242,166,90,.12);color:var(--accent);font-weight:700;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-day{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--raised);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--text);position:relative;}
  .cal-day.empty{visibility:hidden;}
  .cal-day.has-data::after{content:'';width:5px;height:5px;border-radius:99px;background:var(--accent);position:absolute;bottom:6px;}
  .cal-day.selected{border-color:var(--accent);background:rgba(242,166,90,.15);}
  .cal-day.today{color:var(--accent2);font-weight:700;}
  .cal-dow{text-align:center;font-size:10px;color:var(--muted);}

  .chart-box{width:100%;overflow-x:auto;}
  .med-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--raised);border-radius:12px;}
  .med-due{border:1px solid var(--accent);background:rgba(242,166,90,.1);}
  .switch{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--accent);}
  .switch .knob{width:16px;height:16px;border-radius:99px;background:var(--text);position:absolute;top:3px;left:3px;transition:left .15s;}
  .switch.on .knob{left:19px;background:var(--bg);}

  .scanner-video-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;}
  .scanner-video-wrap video{width:100%;height:100%;object-fit:cover;}
  .scanner-frame{position:absolute;inset:18% 12%;border:3px solid var(--accent);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none;}

  @media (max-width: 820px){
    #app{flex-direction:column;}
    nav.side{width:100%;height:auto;position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:12px;border-right:none;border-bottom:1px solid var(--line);z-index:20;background:var(--bg);}
    nav.side::after{content:'';position:absolute;top:0;right:0;bottom:0;width:32px;background:linear-gradient(to right, transparent, var(--bg));pointer-events:none;}
    nav.side .brand{display:none;}
    nav.side .navbtn{flex-direction:column;font-size:10px;gap:4px;white-space:nowrap;}
    nav.side .foot{margin-top:0;margin-left:auto;flex-direction:row;border-left:1px solid var(--line);padding-left:10px;}
    main{padding:18px 16px 60px;}
    .grid2{grid-template-columns:1fr;}
  }
</style>
</head>

const LS = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch{ return null; } },
  set(k,v){
    try{
      localStorage.setItem(k, JSON.stringify(v));
      if(k!=='vl:_lastChangeAt'){
        localStorage.setItem('vl:_lastChangeAt', String(Date.now()));
        if(k!=='vl:apikey' && typeof window._scheduleCloudPush==='function') window._scheduleCloudPush();
      }
      return true;
    }catch(e){ console.error('storage error', e); return false; }
  }
};

function isoOf(y,m,day){ return `${y}-${pad(m+1)}-${pad(day)}`; }

function getLang(){ return LS.get('vl:lang') || 'es'; }
function setLang(l){ LS.set('vl:lang', l); state.lang = l; render(); }
function tr(key){ return (I18N[state.lang] && I18N[state.lang][key]) ?? I18N.es[key] ?? key; }

const DOW_ES = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DOW_EN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function dowLabels(){ return state.lang==='en' ? DOW_EN : DOW_ES; }
function dayLetter(iso){ const [y,m,dd]=iso.split('-').map(Number); const idx=(new Date(y,m-1,dd).getDay()+6)%7; return dowLabels()[idx][0]; }
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabels(){ return state.lang==='en' ? MONTHS_EN : MONTHS_ES; }
function formatDateEs(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(state.lang==='en' ? 'en-US' : 'es-ES', { weekday:'long', day:'numeric', month:'long' });
}
function nowHM(){ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const BODYCOMP_FIELDS = [

// Groups the long scale-reading form into scannable sections instead of one flat list.
const BODYCOMP_GROUPS = {
  bmi:'corporal', bodyFatPct:'corporal', bodyWaterPct:'corporal',
  skeletalMusclePct:'corporal', subcutaneousFatPct:'corporal', visceralFat:'corporal',
  muscleMassKg:'corporal', skeletalMassKg:'corporal', proteinPct:'corporal',
  heartRate:'cardio', cardiacIndex:'cardio',
  bmr:'metabolismo', fatLossKg:'metabolismo', bodyAge:'metabolismo',
};
function groupedBodyCompFields(){
  const order = [];
  const map = {};
  BODYCOMP_FIELDS.forEach(f=>{
    const g = BODYCOMP_GROUPS[f.key] || 'otros';
    if(!map[g]){ map[g] = []; order.push(g); }
    map[g].push(f);
  });
  return order.map(groupKey=>({ groupKey, fields: map[groupKey] }));
}
function bcUnit(f){ return f.key==='bodyAge' ? (state.lang==='en'?'years':'años') : f.unit; }
// General adult reference bands, not personalized by sex/age. Fields without a
// universally-agreed target (bmr, fatLossKg, muscleMassKg, skeletalMassKg,
// bodyAge) are intentionally omitted — no color is more honest than a fake one.
const BODYCOMP_RANGES = {
  bmi: { good:[18.5,24.9], badLow:17, badHigh:30 },
  bodyFatPct: { good:[10,25], badLow:6, badHigh:32 },

};
function bodyCompStatus(key, v){
  const r = BODYCOMP_RANGES[key];
  if(!r || v==null) return null;
  if(v>=r.good[0] && v<=r.good[1]) return 'good';
  if(v<r.badLow || v>r.badHigh) return 'bad';
  return 'warn';

function normalizeFoodKey(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' '); }
function rekeyByLabel(raw, getLabel){
  const fixed = {};
  let dirty = false;
  Object.keys(raw).forEach(k=>{
    const entry = raw[k];
    const properKey = normalizeFoodKey(getLabel(entry));
    if(properKey !== k) dirty = true;
    if(!fixed[properKey] || (entry.ts||0) > (fixed[properKey].ts||0)) fixed[properKey] = entry;
  });
  return { fixed, dirty };
}
// One-time backfill: older entries added before a history feature existed only ever
// got written into that day's own record, never into the shared suggestion cache.
// Walk every saved day and fill in anything still missing, without touching entries
// the cache already has (those stay authoritative, including any newer edits).
function backfillFromDays(existing, extractItems, buildEntry){
  let dirty = false;
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(!k || !k.startsWith('vl:day:')) continue;
    const iso = k.slice('vl:day:'.length);
    let day;
    try{ day = JSON.parse(localStorage.getItem(k)); }catch{ continue; }
    if(!day) continue;
    extractItems(day).forEach(item=>{
      const key = normalizeFoodKey(item.name);
      if(!key || existing[key]) return;
      const ts = Date.parse(`${iso}T${item.time||'00:00'}:00`) || 0;
      existing[key] = buildEntry(item, ts);
      dirty = true;
    });
  }
  return dirty;
}
function getNutritionCache(){
  const raw = LS.get('vl:nutrition-cache') || {};
  const { fixed, dirty } = rekeyByLabel(raw, e=>e.label);
  const backfilled = backfillFromDays(fixed, day=>day.meals||[], (item, ts)=>({
    label: item.name, calories: item.calories||0, protein: item.protein||0, carbs: item.carbs||0, fat: item.fat||0,
    fiber: item.fiber||0, sugar: item.sugar||0, sodium: item.sodium||0, iron: item.iron||0, calcium: item.calcium||0,
    potassium: item.potassium||0, vitaminC: item.vitaminC||0, note: '', ts
  }));
  if(dirty || backfilled) setNutritionCache(fixed);
  return fixed;
}
function setNutritionCache(c){ return LS.set('vl:nutrition-cache', c); }
function rememberNutrition(name, entry){
  const cache = getNutritionCache();
  const key = normalizeFoodKey(name);
  if(!key) return;
  cache[key] = { label: name.trim(), calories: entry.calories, protein: entry.protein||0, carbs: entry.carbs||0, fat: entry.fat||0,
    fiber: entry.fiber||0, sugar: entry.sugar||0, sodium: entry.sodium||0, iron: entry.iron||0, calcium: entry.calcium||0, potassium: entry.potassium||0, vitaminC: entry.vitaminC||0,
    note: entry.note||'', ts: Date.now() };
  setNutritionCache(cache);
}
function getExerciseHistory(){
  const raw = LS.get('vl:exercise-history') || {};
  const { fixed, dirty } = rekeyByLabel(raw, e=>e.label);
  const backfilled = backfillFromDays(fixed, day=>day.exercises||[], (item, ts)=>({

}

function rememberExercise(name, minutes, calories){

}

async function estimateNutrition(desc){
  const key = getApiKey();
  if(!key) throw new Error('Agrega tu API key de Anthropic en Ajustes para usar esta función');
  const prompt = `Eres un nutricionista. Estima el contenido nutricional para el siguiente alimento, considerando la cantidad/porción indicada, usando valores nutricionales típicos (USDA u equivalente). Si la porción no se especifica, asume una porción individual estándar. Responde ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin markdown, sin backticks:
{"calories": <entero kcal>, "protein": <entero g>, "carbs": <entero g>, "fat": <entero g>, "fiber": <entero g>, "sugar": <entero g>, "sodium": <entero mg>, "iron": <entero mg>, "calcium": <entero mg>, "potassium": <entero mg>, "vitaminC": <entero mg>, "note": "<nota breve en español, max 10 palabras>"}

Alimento: "${desc}"`;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:300, messages:[{role:'user', content:prompt}] })
  });
  if(!res.ok){ const t = await res.text(); throw new Error('API error: '+t.slice(0,200)); }
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.text||'').join('');
  const clean = text.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(clean);
  if(typeof parsed.calories !== 'number') throw new Error('respuesta inválida');
  return parsed;
}

function getDailyInsightCache(){ return LS.get('vl:insight-cache') || {}; }
function setDailyInsightCache(c){ return LS.set('vl:insight-cache', c); }
async function generateDailyInsight(force){
  const iso = todayISO();
  const cache = getDailyInsightCache();
  if(!force && cache[iso]) return cache[iso];
  const key = getApiKey();
  if(!key) throw new Error('Agrega tu API key de Anthropic en Ajustes para usar esta función');

  const d = state.day, g = state.goals;
  const calEaten = d.meals.reduce((s,m)=>s+(Number(m.calories)||0),0);
  const exMin = d.exercises.reduce((s,e)=>s+(Number(e.minutes)||0),0);
  const lastBP = d.bp[d.bp.length-1];
  const score = vitalityScore();
  const weightHist = getWeightHistory(7);
  const weightTrend = weightHist.length>=2 ? (weightHist[weightHist.length-1].weight - weightHist[0].weight) : null;
  const adherence = state.meds.length>0 ? medAdherence(7) : null;

  const context = [
    score!=null ? `Puntaje de vitalidad hoy: ${score}/100` : null,
    `Calorías: ${calEaten} de meta ${g.calorieGoal} kcal`,
    `Agua: ${d.water} de meta ${g.waterGoal} vasos`,
    `Ejercicio: ${exMin} de meta ${g.exerciseGoal} min`,
    d.sleepHours!=null ? `Sueño: ${d.sleepHours} h` : null,
    lastBP ? `Presión: ${lastBP.systolic}/${lastBP.diastolic} mmHg (${bpCategory(lastBP.systolic,lastBP.diastolic).label})` : null,
    adherence!=null ? `Adherencia a medicamentos (7 días): ${adherence}%` : null,
    weightTrend!=null ? `Cambio de peso (7 días): ${weightTrend>0?'+':''}${weightTrend.toFixed(1)} kg` : null,
  ].filter(Boolean).join('\n');

  const prompt = `Eres un asistente de salud breve y alentador, nunca clínico ni alarmista. Con base en estos datos del día de un usuario, escribe UNA sola frase corta (máximo 20 palabras) en español, observando un patrón real de los datos o dando ánimo específico. No repitas los números tal cual, interprétalos. No des consejo médico. No uses signos de exclamación en exceso.

Datos de hoy:
${context}

Responde solo con la frase, sin comillas ni explicación adicional.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:100, messages:[{role:'user', content:prompt}] })
  });
  if(!res.ok){ const t = await res.text(); throw new Error('API error: '+t.slice(0,200)); }
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.text||'').join('').trim();
  cache[iso] = text;
  setDailyInsightCache(cache);
  return text;
}
async function handleGenerateInsight(force){
  const btn = document.getElementById('insight-btn');
  const errEl = document.getElementById('insight-error');
  if(btn){ btn.disabled = true; btn.textContent = 'Generando…'; }
  if(errEl) errEl.textContent = '';
  try{
    await generateDailyInsight(force);
    render();
  }catch(e){
    if(errEl) errEl.textContent = e.message || 'No se pudo generar el insight';
    if(btn){ btn.disabled=false; btn.textContent='Generar insight'; }
  }
}

  window._scanBusy = false;
  window._modal = 'scanner';
  render();
  startScanner();
}
function startScanner(){
  const codeReader = new ZXing.BrowserMultiFormatReader();
  window._scannerReader = codeReader;
  codeReader.decodeFromConstraints(
    { video: { facingMode: { ideal: 'environment' } } },
    'scanner-video',
    (result) => { if(result) handleScanResult(result.getText()); }
  ).catch(err=>{
    const statusEl = document.getElementById('scanner-status');
    if(statusEl) statusEl.textContent = 'No se pudo acceder a la cámara: ' + (err.message||err);
  });
}
function stopScanner(){
  if(window._scannerReader){
    try{ window._scannerReader.reset(); }catch(e){}
    window._scannerReader = null;
  }
}
function closeScanner(e){
  if(e && e.target!==e.currentTarget) return;
  stopScanner();
  window._modal = null;
  render();
}
function handleScanResult(text){
  if(window._scanBusy) return;
  window._scanBusy = true;
  stopScanner();
  window._modal = null;
  render();
  lookupBarcode(text);
}

async function fetchOFF(code){
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,code`);
    if(!res.ok) return null;
    const data = await res.json();
    if(data.status!==1 || !data.product) return null;
    return parseOFFProduct(data.product);
  }catch(e){ return null; }
}
function pickGramField(n, key){ const v = n[key+'_100g']; return typeof v==='number' ? Math.round(v) : 0; }
function pickMgField(n, key){ const v = n[key+'_100g']; return typeof v==='number' ? Math.round(v*1000) : 0; }
function parseOFFProduct(p){
  const n = p.nutriments || {};
  const name = [p.product_name, p.brands ? '('+p.brands.split(',')[0].trim()+')' : ''].filter(Boolean).join(' ').trim();
  const kcal = n['energy-kcal_100g'] != null ? n['energy-kcal_100g'] : (n['energy_100g']!=null ? n['energy_100g']/4.184 : 0);
  return {
    label: name || ('Producto '+(p.code||'')),
    calories: Math.round(kcal||0),
    protein: pickGramField(n,'proteins'),
    carbs: pickGramField(n,'carbohydrates'),
    fat: pickGramField(n,'fat'),
    fiber: pickGramField(n,'fiber'),
    sugar: pickGramField(n,'sugars'),
    sodium: pickMgField(n,'sodium'),
    iron: pickMgField(n,'iron'),
    calcium: pickMgField(n,'calcium'),
    potassium: pickMgField(n,'potassium'),
    vitaminC: pickMgField(n,'vitamin-c'),
    note: 'Open Food Facts · valores por 100 g',
    ts: Date.now(),
  };
}
async function lookupBarcode(barcode){
  const cache = getBarcodeCache();
  let product = cache[barcode];
  if(!product){
    product = await lookupSharedBarcodeSafe(barcode);
    if(product){ cache[barcode] = product; setBarcodeCache(cache); }
  }
  if(!product){
    product = await fetchOFF(barcode);
    if(!product && barcode.length < 13) product = await fetchOFF(barcode.padStart(13,'0'));
    if(!product){
      toast('Producto no encontrado en Open Food Facts (código '+barcode+') — ingrésalo manualmente', true);
      return;
    }
    cache[barcode] = product;
    setBarcodeCache(cache);
    contributeSharedBarcodeSafe(barcode, product);
  }
  fillMealFromBarcode(product);
}
function fillMealFromBarcode(product){
  const nameEl = document.getElementById('meal-name');
  if(!nameEl) return;
  nameEl.value = product.label;
  document.getElementById('meal-cal').value = product.calories;
  document.getElementById('meal-p').value = product.protein;
  document.getElementById('meal-c').value = product.carbs;
  document.getElementById('meal-f').value = product.fat;
  window._pendingMicros = { key: normalizeFoodKey(product.label), data: product };
  document.getElementById('meal-note').textContent = '✓ ' + product.note + ' — ajusta la cantidad a tu porción real';
  rememberNutrition(product.label, product);
}

/* ================= tiny SVG chart helpers ================= */
function svgPathThroughValid(xy){
  let started = false;
  return xy.map(pt=>{
    if(!pt) return '';
    const cmd = started ? 'L' : 'M';
    started = true;
    return `${cmd}${pt[0]},${pt[1]}`;
  }).join(' ');
}
function refGridSVG(min, range, w, h, pad, steps, unit){
  const lines = [];
  for(let i=0;i<steps;i++){
    const frac = i/(steps-1);
    const val = min + frac*range;
    const y = h-pad-frac*(h-pad*2);
    lines.push(`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="var(--line)" stroke-dasharray="3,3"/>
      <text x="2" y="${y+3}" font-size="9" fill="var(--muted)">${Math.round(val)}${unit?' '+unit:''}</text>`);
  }
  return lines.join('');
}
function lineChartSVG(points, opts){
  const w = opts.w||520, h = opts.h||150, pad=28;
  const vals = points.map(p=>p.v).filter(v=>v!=null);
  if(vals.length < 2) return `<div style="color:var(--muted);font-size:12px;padding:20px;text-align:center;">${opts.emptyMsg||'No hay suficientes datos aún'}</div>`;
  let min = Math.min(...vals), max = Math.max(...vals);
  if(opts.targetValue!=null){ min = Math.min(min, opts.targetValue); max = Math.max(max, opts.targetValue); }
  const range = (max-min)||1;
  const stepX = (w-pad*2)/(points.length-1);
  const xy = points.map((p,i)=> p.v==null ? null : [pad+i*stepX, h-pad-((p.v-min)/range)*(h-pad*2)]);
  const validPts = svgPathThroughValid(xy);
  const dots = xy.map((p,i)=> p ? `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${opts.color}"/>` : '').join('');
  const labels = points.map((p,i)=>`<text x="${pad+i*stepX}" y="${h-6}" font-size="10" fill="var(--muted)" text-anchor="middle">${p.label}</text>`).join('');
  const grid = opts.gridLines ? refGridSVG(min, range, w, h, pad, opts.gridSteps||4, opts.unit) : '';
  const targetColor = opts.targetColor||'var(--accent2)';
  const targetY = opts.targetValue!=null ? h-pad-((opts.targetValue-min)/range)*(h-pad*2) : null;
  const targetLine = targetY!=null ? `<line x1="${pad}" y1="${targetY}" x2="${w-pad}" y2="${targetY}" stroke="${targetColor}" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="${w-pad-2}" y="${targetY-4}" font-size="9" fill="${targetColor}" text-anchor="end">Meta ${opts.targetValue}${opts.unit?' '+opts.unit:''}</text>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">
    ${grid}
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/>
    ${targetLine}
    <path d="${validPts}" fill="none" stroke="${opts.color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}
function multiLineChartSVG(points, series, opts){
  const w = opts.w||520, h = opts.h||150, pad=28;
  const allVals = points.flatMap(p=>series.map(s=>p[s.key])).filter(v=>v!=null);
  if(allVals.length < 2) return `<div style="color:var(--muted);font-size:12px;padding:20px;text-align:center;">${opts.emptyMsg||'No hay suficientes datos aún'}</div>`;
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const range = (max-min)||1;
  const stepX = (w-pad*2)/(points.length-1);
  const paths = series.map(s=>{
    const xy = points.map((p,i)=> p[s.key]==null ? null : [pad+i*stepX, h-pad-((p[s.key]-min)/range)*(h-pad*2)]);
    const d = svgPathThroughValid(xy);
    const dots = xy.map(pt=> pt?`<circle cx="${pt[0]}" cy="${pt[1]}" r="3" fill="${s.color}"/>`:'').join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>${dots}`;
  }).join('');
  const labels = points.map((p,i)=>`<text x="${pad+i*stepX}" y="${h-6}" font-size="10" fill="var(--muted)" text-anchor="middle">${p.label}</text>`).join('');
  const grid = opts.gridLines ? refGridSVG(min, range, w, h, pad, opts.gridSteps||4, opts.unit) : '';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">
    ${grid}
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/>
    ${paths}${labels}
  </svg>`;
}
function barChartSVG(points, opts){
  const w = opts.w||520, h = opts.h||150, pad=28;
  const vals = points.map(p=>p.v||0);
  const max = Math.max(...vals, opts.goal||0, 1);
  const stepX = (w-pad*2)/points.length;
  const barW = stepX*0.55;
  const bars = points.map((p,i)=>{
    const bh = ((p.v||0)/max)*(h-pad*2);
    const x = pad+i*stepX + (stepX-barW)/2;
    const y = h-pad-bh;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="${opts.color}"/>`;
  }).join('');
  const goalY = opts.goal ? h-pad-(opts.goal/max)*(h-pad*2) : null;
  const goalLine = goalY!=null ? `<line x1="${pad}" y1="${goalY}" x2="${w-pad}" y2="${goalY}" stroke="var(--muted)" stroke-dasharray="4,4"/>` : '';
  const labels = points.map((p,i)=>`<text x="${pad+i*stepX+stepX/2}" y="${h-6}" font-size="10" fill="var(--muted)" text-anchor="middle">${p.label}</text>`).join('');
  const grid = opts.gridLines ? refGridSVG(0, max, w, h, pad, opts.gridSteps||4, opts.unit) : '';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">
    ${grid}
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"/>
    ${goalLine}${bars}${labels}
  </svg>`;
}
function dialSVG(calPct, waterPct, exPct){
  const rings = [
    { r:76, pct:calPct, color:'var(--accent)' },
    { r:60, pct:waterPct, color:'var(--accent3)' },
    { r:44, pct:exPct, color:'var(--accent2)' },
  ];
  const cx=84;
  const circles = rings.map(ring=>{
    const c = 2*Math.PI*ring.r; const clamped = Math.max(0, Math.min(1, ring.pct||0));
    return `<circle cx="${cx}" cy="${cx}" r="${ring.r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="${cx}" cy="${cx}" r="${ring.r}" fill="none" stroke="${ring.color}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c*clamped} ${c}" transform="rotate(-90 ${cx} ${cx})"/>`;
  }).join('');
  return `<svg width="168" height="168" viewBox="0 0 168 168">${circles}</svg>`;
}

function lastBodyComp(day){ return (day.bodyComp && day.bodyComp.length) ? day.bodyComp[day.bodyComp.length-1] : null; }
function latestBodyCompValue(day, key){
  const arr = day.bodyComp || [];
  for(let i=arr.length-1;i>=0;i--){ if(arr[i][key]!=null) return arr[i][key]; }
  return null;
}

/* ================= forecast (Pronóstico) ================= */
const KCAL_PER_KG = 7700; // approx. energy density of body fat, used to translate a calorie balance into a weight-change rate
function dayAt(iso){ return iso===todayISO() ? state.day : getDay(iso); }
function medAdherence(days){
  const dosesPerDay = state.meds.reduce((s,m)=>s+m.times.length,0);
  if(dosesPerDay===0) return null;
  let taken=0;
  for(let n=0;n<days;n++) taken += dayAt(isoDaysAgo(n)).medsTaken.length;
  return Math.round((taken/(dosesPerDay*days))*100);
}
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function vitalityScore(){
  const d = state.day, g = state.goals;
  const parts = [];

  const calEaten = d.meals.reduce((s,m)=>s+(Number(m.calories)||0),0);
  if(g.calorieGoal>0 && calEaten>0) parts.push(clamp(100 - Math.abs(calEaten-g.calorieGoal)/g.calorieGoal*100, 0, 100));

  if(g.waterGoal>0 && d.water>0) parts.push(clamp((d.water/g.waterGoal)*100, 0, 100));

  const exMin = d.exercises.reduce((s,e)=>s+(Number(e.minutes)||0),0);
  if(g.exerciseGoal>0 && exMin>0) parts.push(clamp((exMin/g.exerciseGoal)*100, 0, 100));

  if(d.sleepHours!=null) parts.push(clamp(100 - Math.abs(d.sleepHours-8)*20, 0, 100));

  const lastBP = d.bp[d.bp.length-1];
  if(lastBP){
    const bpScores = {'Normal':100,'Elevada':75,'Hipertensión etapa 1':50,'Hipertensión etapa 2':25,'Crisis hipertensiva':0};
    parts.push(bpScores[bpCategory(lastBP.systolic, lastBP.diastolic).label] ?? 50);
  }

  if(state.meds.length>0){
    const adh = medAdherence(7);
    if(adh!=null) parts.push(adh);
  }

  if(!parts.length) return null;
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function getWeightHistory(days){
  const isos = Array.from({length:days}).map((_,i)=>isoDaysAgo(days-1-i));
  return isos.map(iso=>({ iso, weight: dayAt(iso).weight })).filter(p=>p.weight!=null);
}
function linearTrendKgPerDay(points){
  if(points.length < 2) return null;
  const [fy,fm,fd] = points[0].iso.split('-').map(Number);
  const firstDate = new Date(fy,fm-1,fd);
  const xs = points.map(p=>{ const [y,m,d]=p.iso.split('-').map(Number); return (new Date(y,m-1,d)-firstDate)/86400000; });
  const ys = points.map(p=>p.weight);
  const n = xs.length;
  const sumX = xs.reduce((a,b)=>a+b,0), sumY = ys.reduce((a,b)=>a+b,0);
  const sumXY = xs.reduce((s,x,i)=>s+x*ys[i],0), sumXX = xs.reduce((s,x)=>s+x*x,0);
  const denom = n*sumXX - sumX*sumX;
  if(denom===0) return null;
  return (n*sumXY - sumX*sumY)/denom;
}
function getAvgDailyCaloriesConsumed(days){
  const isos = Array.from({length:days}).map((_,i)=>isoDaysAgo(days-1-i));
  const totals = isos.map(iso=>dayAt(iso).meals.reduce((s,m)=>s+(Number(m.calories)||0),0)).filter(v=>v>0);
  return totals.length ? totals.reduce((a,b)=>a+b,0)/totals.length : null;
}
function getAvgDailyExerciseBurn(days){
  const isos = Array.from({length:days}).map((_,i)=>isoDaysAgo(days-1-i));
  const totals = isos.map(iso=>dayAt(iso).exercises.reduce((s,e)=>s+(Number(e.calories)||0),0));
  return totals.reduce((a,b)=>a+b,0)/totals.length;
}
function getLatestBMR(){
  for(let n=0;n<=60;n++){
    const v = latestBodyCompValue(dayAt(isoDaysAgo(n)), 'bmr');
    if(v!=null) return v;
  }
  return null;
}
function getLatestWeight(){
  for(let n=0;n<=60;n++){
    const iso = isoDaysAgo(n);
    const w = dayAt(iso).weight;
    if(w!=null) return { iso, weight:w };
  }
  return null;
}
function computeForecast(){
  const cfg = getForecastConfig();
  if(!cfg.heightCm || !cfg.targetWeightKg) return { status:'missing-config' };
  const latest = getLatestWeight();
  if(!latest) return { status:'no-weight', cfg };
  const remainingKg = latest.weight - cfg.targetWeightKg;
  const heightM = cfg.heightCm/100;
  const currentBMI = latest.weight/(heightM*heightM);
  const targetBMI = cfg.targetWeightKg/(heightM*heightM);
  if(Math.abs(remainingKg) < 0.1) return { status:'at-goal', cfg, latest, currentBMI, targetBMI };

  const history = getWeightHistory(30);
  let ratePerDay = null, method = null;
  if(history.length >= 4){
    ratePerDay = linearTrendKgPerDay(history);
    method = 'trend';
  }
  if(ratePerDay==null || Math.abs(ratePerDay) < 0.001){
    const bmr = getLatestBMR();
    const avgBurn = getAvgDailyExerciseBurn(14);
    const avgIntake = getAvgDailyCaloriesConsumed(14);
    if(bmr!=null && avgIntake!=null){
      ratePerDay = (avgIntake - (bmr+avgBurn)) / KCAL_PER_KG;
      method = 'calorie-balance';
    }
  }
  if(ratePerDay==null || Math.abs(ratePerDay) < 0.001){
    return { status:'insufficient-data', cfg, latest, currentBMI, targetBMI, remainingKg };
  }

  const needLoss = remainingKg > 0;
  const rateIsLoss = ratePerDay < 0;
  if(needLoss !== rateIsLoss){
    return { status:'wrong-direction', cfg, latest, currentBMI, targetBMI, remainingKg, ratePerDay, method };
  }
  const daysNeeded = Math.abs(remainingKg/ratePerDay);
  const etaDate = new Date(); etaDate.setDate(etaDate.getDate()+Math.round(daysNeeded));
  return { status:'ok', cfg, latest, currentBMI, targetBMI, remainingKg, ratePerDay, method, daysNeeded, etaDate };
}
function bodyCompEntryHTML(bc, onDelete){
  const chips = BODYCOMP_FIELDS.filter(f=>bc[f.key]!=null).map(f=>{

function weightSummaryHTML(pts){
  const valid = pts.filter(p=>p.v!=null);
  if(valid.length < 2) return '';
  const first = valid[0].v, last = valid[valid.length-1].v;
  const change = last - first;
  const sign = change>0?'+':'';
  const targetKg = getForecastConfig().targetWeightKg;
  let color = 'var(--text)';
  let goalLine = '';
  if(targetKg){
    const dist = last - targetKg;
    const needLoss = dist > 0.05, needGain = dist < -0.05;
    const movingLoss = change < -0.05, movingGain = change > 0.05;
    const onTrack = (needLoss && movingLoss) || (needGain && movingGain);
    const offTrack = (needLoss && movingGain) || (needGain && movingLoss);
    color = onTrack ? 'var(--accent3)' : offTrack ? 'var(--danger)' : 'var(--text)';
    goalLine = Math.abs(dist)<0.05
      ? `<div style="font-size:10px;color:var(--accent3);display:flex;align-items:center;gap:4px;">${navIcon('logrado',12)}${tr('cal_en_meta')}</div>`
      : `<div style="font-size:10px;color:var(--muted);">${dist>0?tr('cal_faltan'):tr('cal_sobran')} ${Math.abs(dist).toFixed(1)} ${tr('cal_para_meta')}</div>`;
  }
  return `<div style="text-align:right;">
    <div style="font-size:13px;font-weight:700;color:${color};">${sign}${change.toFixed(1)} kg</div>
    ${goalLine}
  </div>`;
}
function bpSummaryHTML(){
  const readings = Array.from({length:7}).map((_,i)=>{
    const d = dayAt(isoDaysAgo(i));
    return d.bp[d.bp.length-1];
  }).filter(Boolean);
  if(!readings.length) return '';
  const avgSys = readings.reduce((s,r)=>s+r.systolic,0)/readings.length;
  const avgDia = readings.reduce((s,r)=>s+r.diastolic,0)/readings.length;
  return `<div style="text-align:right;">
    <div style="font-size:13px;font-weight:700;color:var(--text);">${Math.round(avgSys)}/${Math.round(avgDia)} mmHg</div>
    <div style="font-size:10px;color:var(--muted);">Promedio 7 días</div>
  </div>`;
}
function avgSummaryHTML(value, unit, decimals){
  if(value==null) return '';
  return `<div style="text-align:right;">
    <div style="font-size:13px;font-weight:700;color:var(--text);">${value.toFixed(decimals??0)}${unit?' '+unit:''}</div>
    <div style="font-size:10px;color:var(--muted);">Promedio 7 días</div>
  </div>`;
}
function pulseSummaryHTML(){
  const readings = Array.from({length:7}).map((_,i)=>{
    const d = dayAt(isoDaysAgo(i));
    const last = d.bp[d.bp.length-1];
    return last?last.pulse:null;
  }).filter(v=>v!=null);
  if(!readings.length) return '';
  return avgSummaryHTML(readings.reduce((a,b)=>a+b,0)/readings.length, 'bpm', 0);
}
function exerciseAvgSummaryHTML(){
  const totals = Array.from({length:7}).map((_,i)=>dayAt(isoDaysAgo(i)).exercises.reduce((s,e)=>s+(Number(e.minutes)||0),0));

}

  const forecast = computeForecast();
  const weeklyRate = forecast.ratePerDay!=null ? forecast.ratePerDay*7 : null;
  const methodLabel = forecast.method==='trend' ? 'tu tendencia de peso real (últimos 30 días)' : forecast.method==='calorie-balance' ? 'tu balance calórico estimado (metabolismo basal + ejercicio vs. comidas)' : '';

  const configCard = `
  <div class="card">
    <div class="label">Tus datos</div>
    <div class="grid2" style="margin-bottom:14px;">
      <div><div style="font-size:10px;color:var(--muted);margin-bottom:4px;">Altura (cm)</div><input id="fc-height" type="number" value="${cfg.heightCm??''}" placeholder="Ej. 170" style="width:100%;"></div>
      <div><div style="font-size:10px;color:var(--muted);margin-bottom:4px;">Peso meta (kg)</div><input id="fc-target" type="number" step="0.1" value="${cfg.targetWeightKg??''}" placeholder="Ej. 68" style="width:100%;"></div>
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="saveForecastConfig()">Guardar</button>
  </div>`;

  let resultCard = '';
  switch(forecast.status){
    case 'missing-config':
      resultCard = `<div class="card">${emptyState('pronostico','Ingresa tu altura y peso meta arriba para generar tu pronóstico')}</div>`;
      break;
    case 'no-weight':
      resultCard = `<div class="card">${emptyState('peso','Aún no tienes ningún peso registrado — agrega uno en Hoy o en el Calendario')}</div>`;
      break;
    case 'at-goal':
      resultCard = `<div class="card">${emptyState('logrado','¡Ya estás en tu peso meta! Peso actual: '+forecast.latest.weight+' kg')}</div>`;
      break;
    case 'insufficient-data':
      resultCard = `<div class="card">
        <div class="label">Pronóstico</div>
        <div style="color:var(--muted);font-size:13px;line-height:1.6;">
          Todavía no hay suficientes datos para estimar un ritmo de cambio.<br><br>
          Para desbloquear el pronóstico, registra <b>al menos 4 días de peso</b> en las últimas semanas (Progreso), o registra tu <b>metabolismo basal</b> en Composición junto con tus <b>comidas</b> del día — con eso podemos estimar tu balance calórico.
        </div>
      </div>`;
      break;
    case 'wrong-direction':
      resultCard = `<div class="card">
        <div class="label">Pronóstico</div>
        <div style="color:var(--danger);font-size:13px;margin-bottom:10px;">
          Según ${methodLabel}, tu peso se está moviendo en dirección contraria a tu meta (${forecast.remainingKg>0?'necesitas bajar':'necesitas subir'} ${Math.abs(forecast.remainingKg).toFixed(1)} kg, pero tu ritmo actual es de ${weeklyRate>0?'+':''}${weeklyRate.toFixed(2)} kg/semana).
        </div>
        <div class="grid2" style="grid-template-columns:repeat(3,1fr);">
          ${statTile(navIcon('peso',14),'Peso actual', forecast.latest.weight+' kg')}
          ${statTile(navIcon('meta',14),'Meta', forecast.cfg.targetWeightKg+' kg')}
          ${statTile(navIcon('imc',14),'IMC actual', forecast.currentBMI.toFixed(1))}
        </div>
      </div>`;
      break;
    case 'ok': {
      const weeks = forecast.daysNeeded/7;
      resultCard = `<div class="card">
        <div class="label">Pronóstico</div>
        <div class="grid2" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
          ${statTile(navIcon('peso',14),'Peso actual', forecast.latest.weight+' kg')}
          ${statTile(navIcon('meta',14),'Meta', forecast.cfg.targetWeightKg+' kg')}
          ${statTile(navIcon('imc',14),'IMC actual', forecast.currentBMI.toFixed(1))}
          ${statTile(navIcon('imc',14),'IMC meta', forecast.targetBMI.toFixed(1))}
        </div>
        <div style="text-align:center;padding:14px 0;">
          <div class="display" style="font-size:15px;color:var(--muted);margin-bottom:4px;">Tiempo estimado para llegar a tu meta</div>
          <div class="display" style="font-size:32px;font-weight:700;color:var(--accent);">${weeks<1?Math.round(forecast.daysNeeded)+' días':weeks.toFixed(1)+' semanas'}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px;">Fecha estimada: ${forecast.etaDate.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</div>
        </div>
        <div style="font-size:11px;color:var(--muted);text-align:center;">Ritmo estimado: ${weeklyRate>0?'+':''}${weeklyRate.toFixed(2)} kg/semana, basado en ${methodLabel}.</div>
      </div>`;
      break;
    }
  }

  const weightHist = getWeightHistory(30);
  const chartCard = weightHist.length ? `<div class="card">
    <div class="label">Peso vs. meta — últimos 30 días</div>
    <div class="chart-box">${lineChartSVG(
      Array.from({length:30}).map((_,i)=>{ const iso=isoDaysAgo(29-i); return { label:dayLetter(iso), v: dayAt(iso).weight }; }),
      {color:'var(--accent3)', gridLines:true, gridSteps:4, unit:'kg', targetValue: cfg.targetWeightKg||null}
    )}</div>
  </div>` : '';

  return `<div class="stack">${configCard}${resultCard}${chartCard}</div>`;
}

async function handleEstimate(){
  const name = document.getElementById('meal-name').value.trim();
  if(!name) return;
  const cache = getNutritionCache();
  const hit = cache[normalizeFoodKey(name)];
  if(hit){
    document.getElementById('meal-cal').value = hit.calories;
    document.getElementById('meal-p').value = hit.protein;
    document.getElementById('meal-c').value = hit.carbs;
    document.getElementById('meal-f').value = hit.fat;
    window._pendingMicros = { key: normalizeFoodKey(name), data: hit };
    document.getElementById('meal-note').textContent = '✓ Desde tu historial (sin usar API)' + (hit.note?' — '+hit.note:'');
    return;
  }
  const btn = document.getElementById('est-btn');
  btn.disabled = true; btn.textContent = 'Calculando…';
  window._estimateBusy = true;
  try{
    const shared = await lookupSharedFoodSafe(normalizeFoodKey(name));
    if(shared){
      document.getElementById('meal-cal').value = shared.calories;
      document.getElementById('meal-p').value = shared.protein ?? 0;
      document.getElementById('meal-c').value = shared.carbs ?? 0;
      document.getElementById('meal-f').value = shared.fat ?? 0;
      window._pendingMicros = { key: normalizeFoodKey(name), data: shared };
      document.getElementById('meal-note').textContent = '✓ ' + (shared.note||'') + ' — desde el banco compartido';
      rememberNutrition(name, shared);
      return;
    }
    const r = await estimateNutrition(name);
    document.getElementById('meal-cal').value = r.calories;
    document.getElementById('meal-p').value = r.protein ?? 0;
    document.getElementById('meal-c').value = r.carbs ?? 0;
    document.getElementById('meal-f').value = r.fat ?? 0;
    window._pendingMicros = { key: normalizeFoodKey(name), data: r };
    document.getElementById('meal-note').textContent = '✓ ' + (r.note||'') + ' — ajusta si no coincide';
    rememberNutrition(name, r);
    contributeSharedFoodSafe(normalizeFoodKey(name), name, r);
  }catch(e){
    toast(e.message || 'No se pudo estimar', true);
  }finally{
    btn.disabled=false; btn.innerHTML=navIcon('sparkle',14)+'Estimar';
    window._estimateBusy = false;
  }
}

function bpCategory(sys, dia){
  if(sys>180 || dia>120) return { label:'Crisis hipertensiva', color:'var(--danger)' };
  if(sys>=140 || dia>=90) return { label:'Hipertensión etapa 2', color:'var(--danger)' };
  if(sys>=130 || dia>=80) return { label:'Hipertensión etapa 1', color:'var(--accent2)' };
  if(sys>=120 && dia<80) return { label:'Elevada', color:'var(--accent2)' };
  return { label:'Normal', color:'var(--accent3)' };
}
function bpBadge(sys, dia){
  const cat = bpCategory(sys, dia);
  return `<span style="font-size:10px;font-weight:700;color:${cat.color};border:1px solid ${cat.color};border-radius:99px;padding:2px 8px;white-space:nowrap;">${cat.label}</span>`;
}

  const times = document.getElementById('med-times').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!name || times.length===0) return;
  state.meds.push({ id:uid(), name, dose, times });
  setMeds(state.meds); render();
}
function removeMed(id){ state.meds = state.meds.filter(m=>m.id!==id); setMeds(state.meds); render(); }
function toggleMedTaken(key){
  const exists = state.day.medsTaken.find(t=>t.key===key);
  if(exists) state.day.medsTaken = state.day.medsTaken.filter(t=>t.key!==key);
  else state.day.medsTaken.push({ key, time: nowHM() });
  saveDay(); render();
}

function toggleAlerts(){
  state.alertsOn = !state.alertsOn;
  if(state.alertsOn && 'Notification' in window && Notification.permission!=='granted'){
    Notification.requestPermission();
  }
  render();
}
setInterval(()=>{
  if(!state.alertsOn) return;
  const hm = nowHM();
  const takenIds = new Set(state.day.medsTaken.map(t=>t.key));
  state.meds.forEach(med=>{
    med.times.forEach(t=>{
      const key = med.id+':'+t;
      if(t===hm && !takenIds.has(key)){
        if('Notification' in window && Notification.permission==='granted'){
          new Notification('VitaLink — Medicamento', { body: `Es hora de tomar ${med.name}${med.dose?' ('+med.dose+')':''}` });
        }
        try{ new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAAAAAAAAAAA=').play().catch(()=>{}); }catch(e){}
      }
    });
  });
}, 20000);

/* ================= calendar nav ================= */
function shiftMonth(dir){
  let { y, m } = state.calMonth;
  m += dir;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  state.calMonth = { y, m };
  render();
}
function selectCalDate(iso){ state.selectedDate = iso; render(); }

function mutateDay(iso, fn){
  if(iso===todayISO()){
    fn(state.day);
    saveDay();
  } else {
    const day = getDay(iso);
    fn(day);
    setDayData(iso, day);
  }
  render();
}
async function handleEstimateForDay(){
  const name = document.getElementById('cal-meal-name').value.trim();
  if(!name) return;
  const cache = getNutritionCache();
  const hit = cache[normalizeFoodKey(name)];
  if(hit){
    document.getElementById('cal-meal-cal').value = hit.calories;
    document.getElementById('cal-meal-p').value = hit.protein;
    document.getElementById('cal-meal-c').value = hit.carbs;
    document.getElementById('cal-meal-f').value = hit.fat;
    window._pendingMicros = { key: normalizeFoodKey(name), data: hit };
    document.getElementById('cal-meal-note').textContent = '✓ Desde tu historial (sin usar API)' + (hit.note?' — '+hit.note:'');
    return;
  }
  const btn = document.getElementById('cal-est-btn');
  btn.disabled = true; btn.textContent = 'Calculando…';
  window._estimateBusy = true;
  try{
    const shared = await lookupSharedFoodSafe(normalizeFoodKey(name));
    if(shared){
      document.getElementById('cal-meal-cal').value = shared.calories;
      document.getElementById('cal-meal-p').value = shared.protein ?? 0;
      document.getElementById('cal-meal-c').value = shared.carbs ?? 0;
      document.getElementById('cal-meal-f').value = shared.fat ?? 0;
      window._pendingMicros = { key: normalizeFoodKey(name), data: shared };
      document.getElementById('cal-meal-note').textContent = '✓ ' + (shared.note||'') + ' — desde el banco compartido';
      rememberNutrition(name, shared);
      return;
    }
    const r = await estimateNutrition(name);
    document.getElementById('cal-meal-cal').value = r.calories;
    document.getElementById('cal-meal-p').value = r.protein ?? 0;
    document.getElementById('cal-meal-c').value = r.carbs ?? 0;
    document.getElementById('cal-meal-f').value = r.fat ?? 0;
    window._pendingMicros = { key: normalizeFoodKey(name), data: r };
    document.getElementById('cal-meal-note').textContent = '✓ ' + (r.note||'') + ' — ajusta si no coincide';
    rememberNutrition(name, r);
    contributeSharedFoodSafe(normalizeFoodKey(name), name, r);
  }catch(e){
    toast(e.message || 'No se pudo estimar', true);
  }finally{
    btn.disabled=false; btn.innerHTML=navIcon('sparkle',14)+'Estimar';
    window._estimateBusy = false;
  }
}
function addMealForDay(iso){
  if(window._estimateBusy){ toast('Espera a que termine de estimar antes de agregar', true); return; }
  const name = document.getElementById('cal-meal-name').value.trim();
  if(!name) return;
  const pending = window._pendingMicros && window._pendingMicros.key===normalizeFoodKey(name) ? window._pendingMicros.data : null;
  const meal = {
    id: uid(),
    type: document.getElementById('cal-meal-type').value,
    name,
    time: document.getElementById('cal-meal-time').value || nowHM(),
    calories: Number(document.getElementById('cal-meal-cal').value)||0,
    protein: Number(document.getElementById('cal-meal-p').value)||0,
    carbs: Number(document.getElementById('cal-meal-c').value)||0,
    fat: Number(document.getElementById('cal-meal-f').value)||0,
    fiber: pending?.fiber||0, sugar: pending?.sugar||0, sodium: pending?.sodium||0,
    iron: pending?.iron||0, calcium: pending?.calcium||0, potassium: pending?.potassium||0, vitaminC: pending?.vitaminC||0,
  };
  if(meal.calories>0) rememberNutrition(name, meal);
  window._pendingMicros = null;
  mutateDay(iso, day=>day.meals.push(meal));
}
function removeMealForDay(iso, id){ mutateDay(iso, day=>{ day.meals = day.meals.filter(m=>m.id!==id); }); }
function checkExerciseHintForDay(){
  const nameEl = document.getElementById('cal-ex-name');
  if(!nameEl) return;
  const hit = getExerciseHistory()[normalizeFoodKey(nameEl.value.trim())];
  if(hit){
    document.getElementById('cal-ex-min').value = hit.minutes;
    document.getElementById('cal-ex-cal').value = hit.calories;
  }
}
function exerciseSuggestions(query){
  const hist = Object.values(getExerciseHistory()).sort((a,b)=>b.ts-a.ts);
  const q = normalizeFoodKey(query);
  if(!q) return hist.slice(0,8);
  return hist.filter(e=>normalizeFoodKey(e.label).includes(q)).slice(0,8);
}
function onExerciseNameInputForDay(){
  checkExerciseHintForDay();
  const box = document.getElementById('cal-ex-suggest');
  const nameEl = document.getElementById('cal-ex-name');
  if(!box || !nameEl) return;
  const items = exerciseSuggestions(nameEl.value);
  if(!items.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML = items.map(e=>`<div class="suggest-item" onmousedown="pickExerciseSuggestForDay(this)">${esc(e.label)}</div>`).join('');
  box.style.display = 'block';
}
function pickExerciseSuggestForDay(el){
  const nameEl = document.getElementById('cal-ex-name');
  nameEl.value = el.textContent;
  checkExerciseHintForDay();
  hideExerciseSuggestForDay();
}
function hideExerciseSuggestForDay(){
  const box = document.getElementById('cal-ex-suggest');
  if(box) box.style.display = 'none';
}
function addExerciseForDay(iso){
  const name = document.getElementById('cal-ex-name').value.trim();
  if(!name) return;
  const minutes = Number(document.getElementById('cal-ex-min').value)||0;
  const calories = Number(document.getElementById('cal-ex-cal').value)||0;
  const ex = {
    id: uid(),
    name,
    time: document.getElementById('cal-ex-time').value || nowHM(),
    minutes,
    calories,
  };
  rememberExercise(name, minutes, calories);
  mutateDay(iso, day=>day.exercises.push(ex));
}
function removeExerciseForDay(iso, id){ mutateDay(iso, day=>{ day.exercises = day.exercises.filter(e=>e.id!==id); }); }
function setSleepForDay(iso){
  const v = document.getElementById('cal-sleep').value;
  mutateDay(iso, day=>{ day.sleepHours = v===''?null:Number(v); });
}
function setWeightForDay(iso){
  const v = document.getElementById('cal-weight').value;
  mutateDay(iso, day=>{ day.weight = v===''?null:Number(v); });
}

/* ================= backup export/import ================= */
function exportBackup(){
  const all = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('vl:')) all[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(all,null,2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `vitalink-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Respaldo descargado');
}
function triggerImportBackup(){
  document.getElementById('import-file-input').click();
}
function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ toast('El archivo no es un JSON válido', true); return; }
    const keys = Object.keys(data).filter(k=>k.startsWith('vl:'));
    if(!keys.length){ toast('El archivo no contiene datos de VitaLink (vl:...)', true); return; }
    keys.forEach(k=>localStorage.setItem(k, data[k]));
    toast(`Se importaron ${keys.length} registros. Recargando…`);
    setTimeout(()=>location.reload(), 1200);
  };
  reader.onerror = () => toast('No se pudo leer el archivo', true);
  reader.readAsText(file);
  input.value = '';
}

/* ================= cross-tab sync ================= */
// Each tab keeps its own in-memory copy of today's data. Without this, opening
// the dashboard in more than one tab (e.g. clicking the desktop icon twice)
// lets whichever tab saves last silently overwrite entries made in the other.
function resyncFromStorage(){
  state.day = getDay(todayISO());
  state.goals = getGoals();
  state.meds = getMeds();
  render();
}
window.addEventListener('storage', (e)=>{ if(!e.key || e.key.startsWith('vl:')) resyncFromStorage(); });
window.addEventListener('focus', resyncFromStorage);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') resyncFromStorage(); });

/* ================= init ================= */
render();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCa-OtYw9PP02-f7maZ3WSKkYEkpRnHPIc",
    authDomain: "vitalink-widy.firebaseapp.com",
    projectId: "vitalink-widy",
    storageBucket: "vitalink-widy.firebasestorage.app",
    messagingSenderId: "830173192907",
    appId: "1:830173192907:web:dacc740b8909601b99f14e",
    measurementId: "G-8LZ4277YRB"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let unsubscribeSnapshot = null;
  let pushTimer = null;
  let lastPushedAt = 0;

  function safeRender(){ if(typeof window.render==='function') window.render(); }

  function collectLocalData(){
    const all = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k.startsWith('vl:') && k!=='vl:apikey' && k!=='vl:_lastChangeAt') all[k]=localStorage.getItem(k);
    }
    return all;
  }

  async function pushToCloud(){
    if(!currentUser) return;
    window._syncState.syncing = true; window._syncState.error = null; safeRender();
    const ts = Date.now();
    try{
      await setDoc(doc(db,'users',currentUser.uid), { data: collectLocalData(), updatedAt: ts });
      lastPushedAt = ts;
      window._syncState.lastSyncAt = ts;
    }catch(e){
      window._syncState.error = e.message;
    }
    window._syncState.syncing = false; safeRender();
  }
  window._scheduleCloudPush = function(){
    if(!currentUser) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushToCloud, 2000);
  };

  // Shared, cross-user reference banks (foods/{normalizedName}, barcodeFoods/{barcode}).
  // Read is public; write only happens from a vetted source (AI estimate or Open Food
  // Facts), never from raw user text, and is create-only — Firestore rules reject
  // overwriting an existing doc, so the bank is append-only/immutable by construction.
  window.lookupSharedFood = async function(key){
    try{ const snap = await getDoc(doc(db,'foods',key)); return snap.exists() ? snap.data() : null; }
    catch(e){ return null; }
  };
  window.contributeSharedFood = async function(key, data){
    try{ await setDoc(doc(db,'foods',key), data); }catch(e){ /* likely already contributed by another user, or not signed in — both fine to ignore */ }
  };
  window.lookupSharedBarcode = async function(code){
    try{ const snap = await getDoc(doc(db,'barcodeFoods',code)); return snap.exists() ? snap.data() : null; }
    catch(e){ return null; }
  };
  window.contributeSharedBarcode = async function(code, data){
    try{ await setDoc(doc(db,'barcodeFoods',code), data); }catch(e){}
  };

  function applyRemoteSnapshot(snap){
    if(!snap.exists()){ pushToCloud(); return; }
    const remote = snap.data();
    if(remote.updatedAt === lastPushedAt) return; // echo of our own push
    const remoteData = remote.data || {};
    const remoteUpdatedAt = remote.updatedAt || 0;
    const localUpdatedAt = Number(localStorage.getItem('vl:_lastChangeAt')||0);
    if(remoteUpdatedAt > localUpdatedAt){
      Object.keys(remoteData).forEach(k=>localStorage.setItem(k, remoteData[k]));
      localStorage.setItem('vl:_lastChangeAt', String(remoteUpdatedAt));
      window._syncState.lastSyncAt = Date.now();
      if(typeof window.resyncFromStorage === 'function') window.resyncFromStorage();
      else safeRender();
    } else if(localUpdatedAt > remoteUpdatedAt){
      pushToCloud();
    }
  }

  window.firebaseSignIn = async function(){
    try{ await signInWithPopup(auth, provider); }
    catch(e){ window._syncState.error = e.message; safeRender(); }
  };
  window.firebaseSignOut = async function(){
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
    await signOut(auth);
  };

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    window._syncState.user = user ? { email: user.email, uid: user.uid } : null;
    window._syncState.ready = true;
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
    if(user){
      unsubscribeSnapshot = onSnapshot(doc(db,'users',user.uid), applyRemoteSnapshot, (err)=>{
        window._syncState.error = err.message; safeRender();
      });
    }
    safeRender();
  });
</script>
